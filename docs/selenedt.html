<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selene · Datasets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14532d;
    --ink2: #1f3d2b;
    --mut: #9aaba1;
    --mut2: #7d9a89;
    --soft: #f1f8f3;
    --soft2: #e8f5ec;
    --line: #e3f0e7;
    --g: #22c55e;
    --g2: #16a34a;
    --warn: #b45309;
    --err: #b91c1c;
    --serif: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: var(--ink2); font-family: var(--sans); }
  button { font-family: inherit; }

  /* ---------- Grade de 4 telas ---------- */
  #grid { display: flex; flex-direction: column; min-height: 100vh; }
  .q { position: relative; padding: 14px; min-width: 0; min-height: 0; border-bottom: 1px solid var(--line); }
  #qSphere { order: 1; min-height: 400px; z-index: 5; padding: 0; }
  #qTerm   { order: 2; height: 440px; }
  #qStart  { order: 3; padding-bottom: 28px; }
  #qPrompt { order: 4; border-bottom: 0; }
  #prompt  { min-height: 150px; flex: none; }

  @media (min-width: 901px) {
    html, body { height: 100%; overflow: hidden; }
    #grid {
      position: fixed; inset: 0; min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr);
    }
    .q { min-height: 0 !important; }
    #qPrompt { overflow: auto; scrollbar-width: thin; scrollbar-color: #cfe6d6 transparent; }
    #prompt { min-height: 72px; flex: 1; }
    .pbox { min-height: 330px; }
    #qTerm   { grid-column: 1; grid-row: 1; height: auto; border-right: 1px solid var(--line); }
    #qSphere { grid-column: 2; grid-row: 1; }
    #qStart  { grid-column: 1; grid-row: 2; border-right: 1px solid var(--line); border-bottom: 0; }
    #qPrompt { grid-column: 2; grid-row: 2; }
  }

  /* ---------- Terminal ---------- */
  #term {
    display: flex; flex-direction: column; height: 100%; min-height: 0;
    border: 1px solid var(--line); border-radius: 16px; background: #f7fbf8; overflow: hidden;
  }
  #thead {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px 7px 14px;
    border-bottom: 1px solid var(--line); background: #fff;
  }
  .dots { display: flex; gap: 6px; width: 54px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: #cfe6d6; }
  .dots i:first-child { background: #86d9a3; }
  #ttitle { flex: 1; text-align: center; font: italic 400 19px/26px var(--serif); letter-spacing: .04em; color: var(--ink); user-select: none; }
  #ttitle small { font: 400 10.5px var(--mono); color: var(--mut); letter-spacing: .08em; margin-left: 8px; font-style: normal; }
  #tclear { width: 54px; display: flex; justify-content: flex-end; }
  #tbody {
    flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 14px;
    font: 12.5px/1.65 var(--mono); color: var(--ink2);
    scrollbar-width: thin; scrollbar-color: #cfe6d6 transparent;
  }
  #tbody::-webkit-scrollbar { width: 8px; }
  #tbody::-webkit-scrollbar-thumb { background: #cfe6d6; border-radius: 8px; }
  .ln { white-space: pre-wrap; word-break: break-word; min-height: 1.65em; }
  .ln.stream { color: #4a7a5d; }
  .t-dim { color: var(--mut); }
  .t-ok { color: var(--g2); }
  .t-hd { color: var(--ink); font-weight: 500; }
  .t-warn { color: var(--warn); }
  .t-err { color: var(--err); }
  .t-add { display: block; color: #166534; background: rgba(34, 197, 94, .09); border-radius: 3px; padding: 0 6px; margin-left: -6px; }
  .cur { display: inline-block; width: .55em; height: 1.1em; vertical-align: -0.18em; background: var(--g); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Botões pequenos ---------- */
  .tbtn {
    position: relative; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%;
    background: transparent; color: #8fb79c; cursor: pointer; display: grid; place-items: center;
    transition: background .2s, color .2s;
  }
  .tbtn:hover, .tbtn.sel { background: var(--soft); color: var(--ink); }
  .tbtn:disabled { opacity: .4; cursor: not-allowed; background: transparent; color: #8fb79c; }
  .tbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tbtn.on::after { content: ''; position: absolute; right: 6px; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--g); }
  #clip.ok { background: var(--soft2); color: var(--g2); }
  #clip.ok svg { stroke-width: 2.2; }

  /* ---------- Esfera ---------- */
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #topbar {
    position: absolute; top: 12px; left: 14px; right: 14px; z-index: 6;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #left { display: flex; align-items: center; gap: 4px; min-width: 0; }
  #chip { font-size: 11.5px; color: var(--mut2); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: 4px; }
  #icons { display: flex; gap: 2px; flex: none; }
  #status { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 11px; letter-spacing: .1em; color: var(--mut); user-select: none; pointer-events: none; }

  #panel {
    position: absolute; top: 54px; right: 14px; z-index: 20;
    width: min(300px, calc(100% - 28px)); padding: 18px; border-radius: 16px; background: #fff;
    box-shadow: 0 10px 36px rgba(20, 83, 45, .14); font-size: 13px; color: var(--ink2);
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .2s;
  }
  #panel.open { opacity: 1; transform: none; pointer-events: auto; }
  #panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--ink); }
  #panel label { display: block; margin-bottom: 12px; color: var(--mut2); font-size: 12px; }
  #panel input, #panel select {
    display: block; width: 100%; margin-top: 5px; padding: 9px 12px; border: 0; outline: 0;
    border-radius: 10px; background: var(--soft); color: var(--ink); font: inherit; font-size: 13px;
  }
  #panel input:focus, #panel select:focus { background: var(--soft2); }
  #panel .rowtop { display: flex; justify-content: space-between; align-items: baseline; }
  #panel #f-tval { color: var(--ink); font-weight: 600; }
  #panel input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; padding: 0; margin-top: 14px; background: #dcefe2; border-radius: 4px; cursor: pointer; }
  #panel input[type=range]:focus { background: #dcefe2; }
  #panel input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--g); border: 0; }
  #panel input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--g); border: 0; }
  #panel .row { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
  #panel .row select { margin-top: 0; flex: 1; min-width: 0; }
  #panel button { border: 0; border-radius: 10px; padding: 9px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  #panel .primary { background: var(--g); color: #fff; }
  #panel .primary:hover { background: var(--g2); }
  #panel .ghost { background: transparent; color: var(--mut2); }
  #panel .ghost:hover { background: var(--soft); color: var(--ink); }
  #panel .actions { display: flex; gap: 6px; margin-top: 4px; }
  #panel .hint, #panel .status { margin-top: 10px; font-size: 11.5px; line-height: 1.45; color: var(--mut); }

  /* ---------- Iniciar ---------- */
  #qStart { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .startbox { width: min(380px, 100%); display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 8px 0 26px; }
  .lbl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--mut); user-select: none; }
  .qtywrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .qty { display: flex; align-items: center; background: var(--soft); border-radius: 999px; padding: 4px; }
  .qty button { width: 36px; height: 36px; border: 0; border-radius: 50%; background: transparent; color: var(--mut2); font-size: 20px; line-height: 1; cursor: pointer; transition: background .2s, color .2s; }
  .qty button:hover { background: var(--soft2); color: var(--ink); }
  .qty input {
    width: 84px; border: 0; outline: 0; background: transparent; text-align: center; color: var(--ink);
    font: 400 28px/1 var(--serif); -moz-appearance: textfield; appearance: textfield;
  }
  .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .go {
    height: 50px; padding: 0 38px; border: 0; border-radius: 999px; background: var(--g); color: #fff;
    font: 600 15px var(--sans); letter-spacing: .02em; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
    transition: background .2s, transform .1s;
  }
  .go:hover { background: var(--g2); }
  .go:active { transform: scale(.98); }
  .go svg { width: 16px; height: 16px; fill: currentColor; }
  .go.stop { background: var(--soft2); color: var(--ink); }
  .go.stop:hover { background: #dcefe2; }
  #prog { width: 100%; height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; }
  #prog i { display: block; height: 100%; width: 0; background: var(--g); border-radius: 4px; transition: width .5s ease; }
  .stats { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
  .stat b { display: block; font: 400 30px/1.1 var(--serif); color: var(--ink); }
  .stat span { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); }
  #credit { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: #b5cfbe; user-select: none; }
  #credit a { margin-left: .5em; font-family: var(--serif); font-style: italic; font-size: 15px; letter-spacing: .05em; text-transform: none; color: #000; text-decoration: none; }
  #credit a[href]:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Prompt e configurações ---------- */
  .pbox { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
  .qhead { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
  .qhead .t { font: italic 400 20px/1.2 var(--serif); color: var(--ink); letter-spacing: .03em; }
  .qhead .h { font-size: 10.5px; letter-spacing: .08em; color: var(--mut); }
  #prompt {
    flex: 1; min-height: 96px; resize: none; border: 0; outline: 0; border-radius: 14px; background: var(--soft);
    padding: 14px 16px; color: var(--ink2); font: 13.5px/1.6 var(--sans);
    scrollbar-width: thin; scrollbar-color: #cfe6d6 transparent;
  }
  #prompt:focus { background: #ecf6ef; }
  #prompt::placeholder { color: #a9c4b3; }
  .cfg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 10px; align-items: end; }
  .cfg .s4 { grid-column: span 4; }
  .cfg .s2, .cfg .lang, .cfg .fmt { grid-column: span 2; }
  .cfg[data-mode=single] .lang, .cfg[data-mode=single] .fmt { grid-column: span 3; }
  @media (max-width: 480px) { .cfg > * { grid-column: span 6 !important; } }
  .fld { display: flex; flex-direction: column; gap: 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); min-width: 0; }
  .fld input, .fld select {
    width: 100%; border: 0; outline: 0; border-radius: 10px; background: var(--soft); color: var(--ink);
    padding: 8px 10px; font: 13px var(--sans); letter-spacing: 0; text-transform: none;
  }
  .fld input:focus, .fld select:focus { background: var(--soft2); }
  .fld input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .fld input::-webkit-outer-spin-button, .fld input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .rng { display: flex; align-items: center; gap: 4px; }
  .rng i { color: var(--mut); font-style: normal; }
  .seg { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; }
  .seg button { flex: 1; border: 0; border-radius: 999px; background: transparent; color: var(--mut2); padding: 7px 10px; font-size: 12.5px; cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
  .seg button.on { background: var(--g); color: #fff; }
  .tgs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tg { position: relative; cursor: pointer; user-select: none; }
  .tg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .tg span { display: block; padding: 7px 12px; border-radius: 999px; background: var(--soft); color: var(--mut2); font-size: 12px; transition: background .2s, color .2s; }
  .tg input:checked + span { background: var(--soft2); color: var(--ink); box-shadow: inset 0 0 0 1px #b6e3c6; }
  .tg input:focus-visible + span { box-shadow: 0 0 0 2px #86d9a3; }
  .locked .cfgwrap, .locked #prompt { pointer-events: none; opacity: .55; }
  #multiOnly[hidden] { display: none; }
</style>
</head>
<body>
<div id="grid">

  <!-- Terminal (superior esquerda) -->
  <section class="q" id="qTerm">
    <div id="term">
      <div id="thead">
        <div class="dots"><i></i><i></i><i></i></div>
        <div id="ttitle">Selene<small>dataset forge</small></div>
        <div id="tclear">
          <button class="tbtn" id="tclr" type="button" title="Limpar terminal" aria-label="Limpar terminal">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/></svg>
          </button>
        </div>
      </div>
      <div id="tbody">
        <div class="ln" id="tlive"><span class="t-ok">selene@forge</span><span class="t-dim">:~$ </span><span class="cur"></span></div>
      </div>
    </div>
  </section>

  <!-- Esfera + arquivo + provedores (superior direita) -->
  <section class="q" id="qSphere">
    <canvas id="cv"></canvas>
    <div id="topbar">
      <div id="left">
        <button class="tbtn" id="clip" type="button" title="Selecionar arquivo JSON" aria-label="Selecionar arquivo JSON"></button>
        <button class="tbtn" id="dl" type="button" title="Baixar o JSON" aria-label="Baixar o JSON">
          <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/></svg>
        </button>
        <span id="chip"></span>
      </div>
      <div id="icons">
        <button class="tbtn" data-id="gemini" type="button" title="Google (Gemini)" aria-label="Google (Gemini)">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>
        </button>
        <button class="tbtn" data-id="openai" type="button" title="OpenAI (GPT)" aria-label="OpenAI (GPT)">
          <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16.5v3M17 18h3"/></svg>
        </button>
        <button class="tbtn" data-id="groq" type="button" title="Groq" aria-label="Groq">
          <svg viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg>
        </button>
        <button class="tbtn" data-id="llama" type="button" title="Llama local" aria-label="Llama local">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="6" rx="2"/><rect x="4" y="13" width="16" height="6" rx="2"/><path d="M8 8h.01M8 16h.01"/></svg>
        </button>
        <button class="tbtn" data-id="temp" type="button" title="Temperatura" aria-label="Temperatura">
          <svg viewBox="0 0 24 24"><path d="M14 14.5V5a2 2 0 0 0-4 0v9.5a4 4 0 1 0 4 0z"/><path d="M12 9v7"/></svg>
        </button>
      </div>
    </div>
    <div id="panel"></div>
    <div id="status"></div>
  </section>

  <!-- Iniciar + quantidade (inferior esquerda) -->
  <section class="q" id="qStart">
    <div class="startbox">
      <div class="qtywrap">
        <div class="lbl">Quantidade de packs</div>
        <div class="qty">
          <button type="button" id="qm" aria-label="Diminuir">−</button>
          <input id="qty" type="number" min="1" max="999" value="5" inputmode="numeric">
          <button type="button" id="qp" aria-label="Aumentar">+</button>
        </div>
      </div>
      <button class="go" id="go" type="button"></button>
      <div id="prog"><i></i></div>
      <div class="stats">
        <div class="stat"><b id="sPacks">0/0</b><span>packs</span></div>
        <div class="stat"><b id="sConv">0</b><span>conversas</span></div>
        <div class="stat"><b id="sDrop">0</b><span>descartadas</span></div>
        <div class="stat"><b id="sTime">0s</b><span>tempo</span></div>
      </div>
    </div>
    <div id="credit">feito por <a id="creditLink">@Syradevops</a></div>
  </section>

  <!-- Prompt + configurações (inferior direita) -->
  <section class="q" id="qPrompt">
    <div class="pbox" id="pbox">
      <div class="qhead"><span class="t">Prompt de geração</span><span class="h">Ctrl + Enter inicia</span></div>
      <textarea id="prompt" spellcheck="false" placeholder="Descreva o que o modelo deve gerar. Seja específico: domínio, persona do usuário, tom, nível de dificuldade, formato das respostas, exemplos do que fazer e do que evitar.&#10;&#10;Ex.: Conversas entre pessoas e uma assistente de suporte técnico em português do Brasil. Perguntas sobre redes, Linux e Python, de iniciante a avançado. Respostas passo a passo, com exemplos de comandos, e que peçam esclarecimento quando a pergunta for ambígua."></textarea>
      <div class="cfgwrap">
        <div class="cfg" id="cfgGrid" data-mode="single">
          <div class="fld s4">Modo
            <div class="seg" id="seg">
              <button type="button" data-v="single" class="on">Single-shot</button>
              <button type="button" data-v="multi">Multiturno</button>
            </div>
          </div>
          <label class="fld s2">Conversas por pack<input id="gPer" type="number" min="1" max="30" value="5"></label>
          <label class="fld s2" id="multiOnly" hidden>Trocas por conversa
            <span class="rng"><input id="gMin" type="number" min="1" max="12" value="2"><i>–</i><input id="gMax" type="number" min="1" max="12" value="4"></span>
          </label>
          <label class="fld lang">Idioma<input id="gLang" type="text" value="pt-BR" spellcheck="false"></label>
          <label class="fld fmt">Formato de saída
            <select id="gFmt">
              <option value="messages">messages (OpenAI)</option>
              <option value="sharegpt">sharegpt</option>
            </select>
          </label>
        </div>
        <div class="tgs" style="margin-top: 10px">
          <label class="tg"><input type="checkbox" id="gSys"><span>incluir system</span></label>
          <label class="tg"><input type="checkbox" id="gDedupe" checked><span>evitar repetição</span></label>
        </div>
      </div>
    </div>
  </section>
</div>

<input type="file" id="fileIn" accept=".json,.jsonl,application/json" hidden>

<script>
(function () {
  'use strict';

  /* ================= utilidades ================= */
  const $ = function (id) { return document.getElementById(id); };
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  const clamp = function (v, a, b) { v = parseInt(v, 10); if (isNaN(v)) v = a; return Math.max(a, Math.min(b, v)); };
  function fmtBytes(n) { if (n < 1024) return n + ' B'; if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'; return (n / 1048576).toFixed(2) + ' MB'; }
  function fmtTime(s) { s = Math.floor(s); const m = Math.floor(s / 60); return m ? m + 'm ' + String(s % 60).padStart(2, '0') + 's' : s + 's'; }
  function cut(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  class HttpError extends Error { constructor(m, s) { super(m); this.status = s; } }
  class FatalError extends Error {}
  class RetryError extends Error {}

  const SVG_CLIP = '<svg viewBox="0 0 24 24"><path d="M20 11.5l-7.6 7.6a4.5 4.5 0 0 1-6.4-6.4l8-8a3 3 0 0 1 4.2 4.2l-8 8a1.5 1.5 0 0 1-2.1-2.1l7.4-7.4"/></svg>';
  const SVG_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const SVG_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
  const SVG_STOP = '<svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>';

  /* ================= provedores (mesma chave de armazenamento da outra página) ================= */
  const STORE_KEY = 'esfera.provedores';
  const GEN_KEY = 'selene.datasets.gen';
  const GROQ_FALLBACK = ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant'];
  const GEMINI_FALLBACK = ['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-2.0-flash'];
  const MODELS_URL = {

  /* ================= esfera ================= */
  const stage = $('qSphere'), cv = $('cv'), ctx = cv.getContext('2d');
  const COUNT = 1700, SPEED_Y = 0.0025, FOCAL = 900, SIGMA = 0.38;
  let W = 300, H = 300, dpr = 1, R = 100;
  const points = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < COUNT; i++) {
    const y = 1 - (i / (COUNT - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
    points.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r, phase: Math.random() * Math.PI * 2, ox: 0, oy: 0, vx: 0, vy: 0 });
  }
  function fit() {
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  window.addEventListener('resize', fit);
  fit();

  const pulses = [];
  function regionFor(ch) {
    const code = ch.codePointAt(0), lon = (code * 2.399963) % (Math.PI * 2), v = ((code * 37) % 101) / 100, lat = Math.asin(v * 2 - 1);
    return { x: Math.cos(lat) * Math.cos(lon), y: Math.sin(lat), z: Math.cos(lat) * Math.sin(lon) };
  }
  function hueFor(ch) { return -35 + ((ch.codePointAt(0) * 47) % 100) / 100 * 80; }
  function addPulse(dir, amp, hue) {
    pulses.push({ x: dir.x, y: dir.y, z: dir.z, t0: performance.now(), amp: amp, hue: hue });
    if (pulses.length > 60) pulses.shift();
  }
  function pulseChar(ch, amp) { if (ch && ch.trim()) addPulse(regionFor(ch), amp, hueFor(ch)); }
  function burst(n, amp) {
    for (let k = 0; k < n; k++) {
      const p = points[Math.floor(Math.random() * COUNT)];
      addPulse({ x: p.x, y: p.y, z: p.z }, amp, -30 + Math.random() * 70);
    }
  }
  let thinkStart = 0, thinkEnd = 0;
  function startThinking() { thinkStart = performance.now(); thinkEnd = 0; }
  function stopThinking() { thinkEnd = performance.now(); }

  const mouse = { x: -1e4, y: -1e4, lx: -1e4, ly: -1e4, speed: 0, active: false };
  window.addEventListener('pointermove', function (e) {
    const r = stage.getBoundingClientRect();
    const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside) { mouse.active = false; return; }
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (!mouse.active) { mouse.lx = x; mouse.ly = y; }
    mouse.x = x; mouse.y = y; mouse.active = true;
  });
  document.documentElement.addEventListener('mouseleave', function () { mouse.active = false; });
  window.addEventListener('blur', function () { mouse.active = false; });

  let angleY = 0, tt = 0;
  const tiltX = 0.35, cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);

  function frame(now) {
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H * 0.5;

    let level = 0, tk = 0;
    if (thinkStart) {
      const el = now - thinkStart;
      let l = Math.min(1, el / 600);
      if (thinkEnd) {
        const out = (now - thinkEnd) / 1000;
        if (out >= 1) { thinkStart = 0; l = 0; } else l *= 1 - out;
      }
      if (thinkStart) { level = l * l * (3 - 2 * l); tk = el / 1000; }
    }
    angleY += SPEED_Y * (1 + 3 * level);
    tt += 0.01;
    const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

    for (let i = pulses.length - 1; i >= 0; i--) if ((now - pulses[i].t0) / 1000 > 3) pulses.splice(i, 1);
    const act = pulses.map(function (p) {
      const age = (now - p.t0) / 1000;
      return { x: p.x, y: p.y, z: p.z, age: age, env: Math.exp(-age * 1.5), amp: p.amp, hue: p.hue };
    });

    const orbits = [];
    if (level > 0) {
      const a1 = tk * 1.9, a2 = tk * 1.3 + 2.4;
      orbits.push({ x: Math.cos(a1), y: Math.sin(tk * 1.1) * 0.7, z: Math.sin(a1) }, { x: -Math.cos(a2), y: Math.cos(tk * 0.9) * 0.7, z: Math.sin(a2) });
      orbits.forEach(function (o) { const l = Math.sqrt(o.x * o.x + o.y * o.y + o.z * o.z); o.x /= l; o.y /= l; o.z /= l; });
    }
    const breath = level * 0.025 * Math.sin(tk * 3.2);

    const reach = Math.max(70, R * 0.55), reach2 = reach * reach;
    if (mouse.active) {
      const mdx = mouse.x - mouse.lx, mdy = mouse.y - mouse.ly;
      mouse.speed += (Math.sqrt(mdx * mdx + mdy * mdy) - mouse.speed) * 0.2;
    } else mouse.speed *= 0.8;
    mouse.lx = mouse.x; mouse.ly = mouse.y;
    const mouseBoost = (1 + Math.min(1.5, mouse.speed / 25)) * (reach / 110);

    const proj = [];
    for (let n = 0; n < points.length; n++) {
      const p = points[n];
      let disp = 0, glow = 0, hs = 0;
      for (let k = 0; k < act.length; k++) {
        const a = act[k], dx = p.x - a.x, dy = p.y - a.y, dz = p.z - a.z, d2 = dx * dx + dy * dy + dz * dz;
        const g = Math.exp(-d2 / (2 * SIGMA * SIGMA));
        if (g < 0.01) continue;
        const wave = 0.65 + 0.35 * Math.sin(a.age * 12 - Math.sqrt(d2) * 9);
        disp += a.amp * g * a.env * wave; glow += g * a.env; hs += a.hue * g * a.env;
      }
      if (level > 0) {
        const band = Math.sin(p.y * 5 - tk * 4.5);
        disp += level * 0.03 * band;
        glow += level * 0.2 * (band * 0.5 + 0.5);
        hs += level * 22 * Math.sin(p.y * 3 - tk * 3 + p.x * 1.5);
        for (let k = 0; k < orbits.length; k++) {
          const o = orbits[k], dx = p.x - o.x, dy = p.y - o.y, dz = p.z - o.z;
          const g = Math.exp(-(dx * dx + dy * dy + dz * dz) / (2 * 0.3 * 0.3));
          glow += level * g * 0.8; disp += level * g * 0.05; hs += level * g * 30;
        }
      }
      if (glow > 1) glow = 1;
      const m = 1 + Math.sin(tt + p.phase) * 0.008 + disp + breath;
      const px = p.x * m, py = p.y * m, pz = p.z * m;
      const x = px * cosY + pz * sinY, z = -px * sinY + pz * cosY;
      const y2 = py * cosX - z * sinX, z2 = py * sinX + z * cosX;
      const scale = FOCAL / (FOCAL + z2 * R);
      const bx = cx + x * R * scale, by = cy + y2 * R * scale;

      let fx = 0, fy = 0;
      if (mouse.active) {
        const dx = bx - mouse.x, dy = by - mouse.y, dm2 = dx * dx + dy * dy;
        if (dm2 < reach2 && dm2 > 0.01) {
          const d = Math.sqrt(dm2), t2 = 1 - d / reach, f = t2 * t2 * mouseBoost, nx = dx / d, ny = dy / d;
          fx = (nx - ny * 0.35) * f; fy = (ny + nx * 0.35) * f;
        }
      }
      p.vx = (p.vx + fx * 2.2 - p.ox * 0.045) * 0.86;
      p.vy = (p.vy + fy * 2.2 - p.oy * 0.045) * 0.86;
      p.ox += p.vx; p.oy += p.vy;
      const moved = Math.min(1, Math.sqrt(p.ox * p.ox + p.oy * p.oy) / (R * 0.2));
      proj.push({ sx: bx + p.ox, sy: by + p.oy, depth: (z2 + 1) / 2, scale: scale, z: z2, glow: Math.min(1, glow + moved * 0.5), hue: hs + moved * 18 });
    }
    proj.sort(function (a, b) { return b.z - a.z; });
    for (let i = 0; i < proj.length; i++) {
      const q = proj[i], front = 1 - q.depth;
      const size = (0.8 + front * 1.9 * q.scale) * (1 + q.glow * 0.4);
      const alpha = Math.min(1, 0.18 + front * 0.82 + q.glow * 0.15);
      const light = 52 - front * 14 + q.glow * 3, sat = 70 + q.glow * 10;
      const hue = 140 + Math.max(-45, Math.min(55, q.hue));
      ctx.beginPath();
      ctx.fillStyle = 'hsla(' + hue + ',' + sat + '%,' + light + '%,' + alpha + ')';
      ctx.arc(q.sx, q.sy, size, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================= painel de provedores / temperatura ================= */
  const panelEl = $('panel'), statusEl = $('status');
  const pbtns = Array.prototype.slice.call(document.querySelectorAll('#icons .tbtn'));
  let openId = null;
  const P = function (sel) { return panelEl.querySelector(sel); };

  function updateStatus() {

  function fillModels(pid, selected) {

    const list = cfg[pid].models.length ? cfg[pid].models.slice() : (pid === 'gemini' ? GEMINI_FALLBACK : GROQ_FALLBACK).slice();

  async function refreshModels(pid) {
    const status = P('#f-status');

      const res = await fetch(MODELS_URL[pid], { headers: { Authorization: 'Bearer ' + key } });

        .filter(function (id) {

  function renderTemp() {

      '<div class="hint" style="margin-top:-2px;margin-bottom:14px">Menor = respostas mais precisas e previsíveis; maior = mais variadas e criativas. Para datasets, valores entre 0.7 e 1.0 costumam dar boa diversidade. Sem mexer, vale o padrão do modelo.</div>' +
      '<div class="actions"><button type="button" class="primary" id="f-save">Salvar</button><button type="button" class="ghost" id="f-clear">Padrão</button></div>' +
      '<div class="hint">Vale para todos os provedores e fica salvo só neste navegador.</div>';

    show();

  function renderPanel(id) {
    if (id === 'temp') { renderTemp(); return; }
    let html = '<h3>' + TITLES[id] + '</h3>';
    if (id === 'openai') {
      html += '<label>Chave da API<input id="f-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false"></label>' +
              '<label>Modelo<input id="f-model" type="text" placeholder="gpt-4o-mini" spellcheck="false"></label>';
    } else if (id === 'groq' || id === 'gemini') {
      html += '<label>Chave da API<input id="f-key" type="password" placeholder="' + (id === 'gemini' ? 'AIza…' : 'gsk_…') + '" autocomplete="off" spellcheck="false"></label>' +
              '<label>Modelo<span class="row"><select id="f-model"></select><button type="button" class="ghost" id="f-refresh">Atualizar</button></span></label>' +

  function openPanel(id) { openId = id; renderPanel(id); panelEl.classList.add('open'); updateButtons(); }

  /* ================= arquivo JSON (dataset) ================= */
  const clipBtn = $('clip'), dlBtn = $('dl'), chipEl = $('chip'), fileIn = $('fileIn');
  clipBtn.innerHTML = SVG_CLIP;

  function newDs() { const items = []; return { name: 'dataset.json', handle: null, canWrite: false, mode: 'json', root: items, key: null, items: items, seen: new Set(), bytes: 0, dirty: false, loaded: false, warnedMem: false }; }
  let ds = newDs();

  function roleOf(r) {
    r = String(r || '').toLowerCase();
    if (r === 'human' || r === 'user') return 'user';
    if (r === 'gpt' || r === 'assistant' || r === 'model' || r === 'bot') return 'assistant';
    if (r === 'system') return 'system';
    return null;
  }
  function firstUser(item) {
    try {
      const arr = item && (item.messages || item.conversations);
      if (!Array.isArray(arr)) return '';
      const m = arr.find(function (x) { return roleOf(x && (x.role || x.from)) === 'user'; });
      const c = m && (m.content != null ? m.content : m.value);
      return typeof c === 'string' ? c : '';
    } catch (e) { return ''; }
  }
  function keyOf(text) { return String(text || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().slice(0, 160); }

  function pickKey(obj) {
    const pref = ['conversations', 'data', 'packs', 'examples', 'items', 'dataset', 'samples', 'train'];
    for (let i = 0; i < pref.length; i++) if (Array.isArray(obj[pref[i]])) return pref[i];
    const ks = Object.keys(obj);
    for (let j = 0; j < ks.length; j++) if (Array.isArray(obj[ks[j]])) return ks[j];
    return null;
  }

  function refreshFileUI() {
    clipBtn.classList.toggle('ok', ds.loaded);
    clipBtn.innerHTML = ds.loaded ? SVG_CHECK : SVG_CLIP;
    clipBtn.title = ds.loaded ? 'Arquivo: ' + ds.name + ' (clique para trocar)' : 'Selecionar arquivo JSON';
    chipEl.textContent = ds.loaded ? ds.name + ' · ' + ds.items.length + ' itens' : (ds.items.length ? 'novo · ' + ds.items.length + ' itens' : '');
  }
  refreshFileUI();

  async function loadFile(file, handle) {
    const text = await file.text();
    let mode = 'json', root, items, key = null, created = false, wrapped = false;
    const parseLines = function () { return text.split(/\r?\n/).filter(function (l) { return l.trim(); }).map(function (l) { return JSON.parse(l); }); };
    const isRecord = function (o) {
      const arr = o && (Array.isArray(o.messages) ? o.messages : (Array.isArray(o.conversations) ? o.conversations : null));
      return !!arr && arr.length > 0 && arr.every(function (m) { return m && typeof m === 'object' && roleOf(m.role || m.from); });
    };
    if (!text.trim()) { root = items = []; }
    else {
      let done = false;
      if (/\.jsonl$/i.test(file.name || '')) {
        try { items = parseLines(); mode = 'jsonl'; root = items; done = true; } catch (e) {}
      }
      if (!done) {
        try { root = JSON.parse(text); }
        catch (e) {
          try { items = parseLines(); mode = 'jsonl'; root = items; }
          catch (e2) { throw new Error('JSON inválido: ' + e.message); }
        }
      }
    }
    if (mode === 'json') {
      if (Array.isArray(root)) items = root;
      else if (isRecord(root)) { items = [root]; root = items; wrapped = true; }
      else if (root && typeof root === 'object') {
        key = pickKey(root);
        if (!key) { key = 'conversations'; root[key] = []; created = true; }
        items = root[key];
      } else throw new Error('o JSON precisa ser uma lista ou um objeto que contenha uma lista.');
    }
    ds = { name: file.name || 'dataset.json', handle: handle || null, canWrite: false, mode: mode, root: root, key: key, items: items, seen: new Set(), bytes: file.size, dirty: false, loaded: true, warnedMem: false };
    items.forEach(function (it) { const k = keyOf(firstUser(it)); if (k) ds.seen.add(k); });
    // detecta o formato dos registros existentes
    let fmtNote = '';
    if (items.length && items[0] && typeof items[0] === 'object') {

  /* ================= chamada ao modelo (streaming) ================= */
  function endpoint() {
    const id = cfg.active;
    if (!id) throw new FatalError('nenhum provedor ativo. Clique em um dos ícones no canto da esfera, configure e salve.');
    const headers = { 'Content-Type': 'application/json' };
    let url, model;
    if (id === 'openai') {
      if (!cfg.openai.key) throw new FatalError('falta a chave da OpenAI.');
      url = 'https://api.openai.com/v1/chat/completions'; headers.Authorization = 'Bearer ' + cfg.openai.key; model = cfg.openai.model || 'gpt-4o-mini';
    } else if (id === 'gemini') {
      if (!cfg.gemini.key) throw new FatalError('falta a chave do Gemini.');
      url = 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions'; headers.Authorization = 'Bearer ' + cfg.gemini.key; model = cfg.gemini.model;
    } else if (id === 'groq') {
      if (!cfg.groq.key) throw new FatalError('falta a chave da Groq.');
      url = 'https://api.groq.com/openai/v1/chat/completions'; headers.Authorization = 'Bearer ' + cfg.groq.key; model = cfg.groq.model;
    } else {
      let base = (cfg.llama.url || '').trim().replace(/\/+$/, '');
      if (!base) throw new FatalError('falta o endereço da API do Llama.');
      if (!/^https?:\/\//i.test(base)) base = 'http://' + base;
      url = /\/v1$/.test(base) ? base + '/chat/completions' : base + '/v1/chat/completions';
      model = cfg.llama.model || 'local';
    }
    return { url: url, headers: headers, model: model, id: id };
  }

  async function streamChat(messages, signal, onDelta) {
    const ep = endpoint();
    const payload = { model: ep.model, messages: messages, stream: true };
    if (typeof cfg.sys.temp === 'number') payload.temperature = cfg.sys.temp;
    const res = await fetch(ep.url, { method: 'POST', headers: ep.headers, body: JSON.stringify(payload), signal: signal });
    if (!res.ok) throw new HttpError(await errorText(res), res.status);
    const ct = res.headers.get('content-type') || '';
    if (!/event-stream/i.test(ct) || !res.body) {
      const d = await res.json();
      const c = d.choices && d.choices[0];
      const text = (c && c.message && c.message.content) || '';
      if (text) onDelta(text);
      return { text: text, finish: c && c.finish_reason };
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '', finish = '';
    for (;;) {
      const r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (line.indexOf('data:') !== 0) continue;
        const d = line.slice(5).trim();
        if (!d || d === '[DONE]') continue;
        let j;
        try { j = JSON.parse(d); } catch (e) { continue; }
        if (j.error) throw new HttpError('erro: ' + (j.error.message || JSON.stringify(j.error)), 500);
        const ch = j.choices && j.choices[0];
        if (ch) {
          const t = ch.delta && ch.delta.content;
          if (t) { text += t; onDelta(t); }
          if (ch.finish_reason) finish = ch.finish_reason;
        }
      }
    }
    return { text: text, finish: finish };
  }

  /* ================= montagem do pedido e leitura da resposta ================= */
  function buildMessages(n, total, g) {
    const modeRule = g.mode === 'single'
      ? '- Modo single-shot: cada conversa tem exatamente 2 mensagens: uma "user" e, em seguida, uma "assistant".'
      : '- Modo multiturno: cada conversa alterna "user" e "assistant", começa com "user" e termina com "assistant", com entre ' + g.min + ' e ' + g.max + ' trocas (uma troca = uma mensagem "user" + uma "assistant"). Varie o número de trocas entre as conversas.';
    const sysRule = g.sys
      ? '- Cada conversa começa com uma mensagem {"role":"system","content":"..."} curta e coerente com o cenário, antes da primeira mensagem "user".'
      : '- Não inclua mensagens "system".';
    const system =
      'Você é um gerador de datasets de conversas para o treinamento de modelos de linguagem.\n' +
      'Responda SOMENTE com um objeto JSON válido, sem markdown, sem blocos de código e sem nenhum texto fora do JSON, exatamente neste formato:\n' +
      '{"conversations":[{"messages":[{"role":"user","content":"..."},{"role":"assistant","content":"..."}]}]}\n\n' +
      'Regras obrigatórias:\n' +
      '- Gere exatamente ' + g.per + ' conversas neste lote.\n' +
      modeRule + '\n' + sysRule + '\n' +
      '- Idioma das conversas: ' + g.lang + '.\n' +
      '- As mensagens "assistant" devem ser completas, corretas e do melhor nível possível: elas são o alvo do treinamento.\n' +
      '- As mensagens "user" devem soar naturais e variadas (tamanho, tom e nível de detalhe diferentes).\n' +
      '- Cada conversa deve ter tema e primeira mensagem diferentes das demais.\n' +
      '- Escape corretamente aspas e quebras de linha dentro das strings JSON.';
    let user = g.prompt + '\n\n---\nLote ' + n + ' de ' + total + '. Gere ' + g.per + ' conversas.' + (n > 1 ? ' Explore temas e cenários diferentes dos lotes anteriores.' : '');
    if (g.dedupe && ds.items.length) {
      const recent = ds.items.slice(-20).map(function (it) { return cut(firstUser(it).replace(/\s+/g, ' '), 100); }).filter(Boolean);
      if (recent.length) user += '\n\nPrimeiras mensagens que já existem no dataset (não repita esses temas nem reescreva essas perguntas):\n' + recent.map(function (r) { return '- ' + r; }).join('\n');
    }
    return [{ role: 'system', content: system }, { role: 'user', content: user }];
  }

  function pickList(j) {
    if (Array.isArray(j)) return j;
    if (j && typeof j === 'object') {
      const ks = ['conversations', 'data', 'items', 'examples', 'packs'];
      for (let i = 0; i < ks.length; i++) if (Array.isArray(j[ks[i]])) return j[ks[i]];
      if (Array.isArray(j.messages)) return [j];
    }
    return [];
  }
  /* ---- Limpeza automática de JSON malformado (3 camadas) ---- */
  function tryParse(s) { try { return JSON.parse(s); } catch (e) { return undefined; } }

  // Conserta os defeitos mais comuns de modelos pequenos: vírgula sobrando, chaves/colchetes trocados ou sem fechar,
  // quebras de linha cruas dentro de strings, vírgula faltando entre itens, cerca de markdown e texto fora do JSON.
  function repairJson(src) {
    let t = String(src).trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '');
    const a = t.search(/[\[{]/);
    if (a > 0) t = t.slice(a);
    let out = '', inStr = false, esc = false;
    const stack = [];
    const lastSig = function () { const m = out.match(/(\S)\s*$/); return m ? m[1] : ''; };
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (inStr) {
        if (esc) { out += c; esc = false; }
        else if (c === '\\') { out += c; esc = true; }
        else if (c === '"') { out += c; inStr = false; }
        else if (c === '\n') out += '\\n';
        else if (c === '\r') { /* ignora */ }
        else if (c === '\t') out += '\\t';
        else out += c;
        continue;
      }
      if (c === '"') {
        if (lastSig() === '"' && stack[stack.length - 1] === '[') out += ',';
        inStr = true; out += c; continue;
      }
      if (c === '{' || c === '[') {
        const ls = lastSig();
        if ((ls === '}' || ls === ']') && stack[stack.length - 1] === '[') out += ',';
        stack.push(c); out += c; continue;
      }
      if (c === '}' || c === ']') {
        out = out.replace(/,\s*$/, '');
        const want = c === '}' ? '{' : '[';
        if (stack.length && stack[stack.length - 1] === want) { stack.pop(); out += c; }
        else if (stack.indexOf(want) >= 0) {
          while (stack[stack.length - 1] !== want) { out = out.replace(/,\s*$/, ''); out += stack.pop() === '{' ? '}' : ']'; }
          stack.pop(); out += c;
        }
        if (!stack.length) break;     // raiz fechada: ignora qualquer texto depois dela
        continue;
      }
      out += c;
    }
    if (inStr) out += '"';
    out = out.replace(/,\s*$/, '');
    while (stack.length) out += stack.pop() === '{' ? '}' : ']';
    return out;
  }

  function parseFlatMsg(body) {
    let o = tryParse(body);
    if (o === undefined) o = tryParse(repairJson(body));
    if (o && typeof o === 'object' && !Array.isArray(o)) {
      const role = roleOf(o.role || o.from), c = o.content != null ? o.content : o.value;
      if (role && typeof c === 'string') return { role: role, content: c };
    }
    const rm = body.match(/"(?:role|from)"\s*:\s*"([^"]*)"/);
    const cm = body.match(/"(?:content|value)"\s*:\s*"((?:[^"\\]|\\[\s\S])*)"/);
    if (!rm || !cm) return null;
    const role2 = roleOf(rm[1]);
    if (!role2) return null;
    let c2 = cm[1];
    try { c2 = JSON.parse('"' + c2.replace(/\r?\n/g, '\\n') + '"'); } catch (e) {}
    return { role: role2, content: c2 };
  }

  // Última camada: ignora a estrutura e recolhe cada mensagem {role, content} que estiver legível no texto.
  function tolerantExtract(t) {
    const msgs = [];
    let i = 0;
    while (i < t.length) {
      const s = t.indexOf('{', i);
      if (s < 0) break;
      let inStr = false, esc = false, k = s + 1, end = -1, nested = false;
      for (; k < t.length; k++) {
        const c = t[k];
        if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
        if (c === '"') { inStr = true; continue; }
        if (c === '{') { nested = true; break; }
        if (c === '}') { end = k; break; }
      }
      if (nested) { i = k; continue; }
      if (end < 0) break;                       // objeto cortado no fim: descarta
      const m = parseFlatMsg(t.slice(s, end + 1));
      if (m) { m.pos = s; msgs.push(m); }
      i = end + 1;
    }
    if (!msgs.length) return [];
    const marks = [];
    const re = /"messages"\s*:/g;
    let mm;
    while ((mm = re.exec(t))) marks.push(mm.index);
    const groups = [];
    if (marks.length) {
      msgs.forEach(function (m) {
        let g = 0;
        while (g < marks.length && marks[g] < m.pos) g++;
        (groups[g] = groups[g] || []).push(m);
      });
    } else {
      let cur = [];
      msgs.forEach(function (m) {
        const prev = cur[cur.length - 1];
        if (cur.length && ((m.role === 'user' && prev.role === 'assistant') || (m.role === 'system' && prev.role !== 'system'))) { groups.push(cur); cur = []; }
        cur.push(m);
      });
      if (cur.length) groups.push(cur);
    }
    return groups.filter(Boolean).map(function (g) { return { messages: g.map(function (m) { return { role: m.role, content: m.content }; }) }; });
  }

  function extractConversations(text) {
    const t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/, '');
    let j = tryParse(t);
    if (j === undefined) { const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) j = tryParse(t.slice(a, b + 1)); }
    if (j !== undefined) { const l = pickList(j); if (l.length) return { list: l, method: 'direct' }; }
    const rep = tryParse(repairJson(t));
    const repList = rep !== undefined ? pickList(rep) : [];
    const tol = tolerantExtract(t);
    if (repList.length && repList.length >= tol.length) return { list: repList, method: 'repaired' };
    if (tol.length) return { list: tol, method: 'tolerant' };
    return { list: [], method: 'none' };
  }

  // Limpeza do texto: tira rótulos repetidos ("assistant: ..."), espaços nas pontas e excesso de linhas em branco
  function cleanText(c, role) {
    c = String(c).replace(/\r/g, '').trim();
    if (role === 'user') c = c.replace(/^(?:user|usuário|usuario|human)\s*:\s*/i, '');
    else if (role === 'assistant') c = c.replace(/^(?:assistant|assistente)\s*:\s*/i, '');
    return c.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  function normalizeConv(raw, g) {
    const arr = raw && (raw.messages || raw.conversations);
    if (!Array.isArray(arr)) return { err: 'sem mensagens' };
    let msgs = [];
    for (let i = 0; i < arr.length; i++) {
      const m = arr[i], role = roleOf(m && (m.role || m.from)), c = m && (m.content != null ? m.content : m.value);
      if (!role || typeof c !== 'string' || !c.trim()) return { err: 'mensagem inválida' };
      msgs.push({ role: role, content: cleanText(c, role) });
    }
    let sys = null;
    if (msgs[0] && msgs[0].role === 'system') sys = msgs.shift();
    if (msgs.some(function (m) { return m.role === 'system'; })) return { err: 'system fora do lugar' };
    for (let k = 0; k < msgs.length; k++) if (msgs[k].role !== (k % 2 === 0 ? 'user' : 'assistant')) return { err: 'ordem dos papéis' };
    if (msgs.length && msgs[msgs.length - 1].role === 'user') msgs.pop();
    let ex = Math.floor(msgs.length / 2);
    if (ex < 1) return { err: 'incompleta' };
    if (g.mode === 'single') ex = 1;
    else { if (ex < g.min) return { err: 'poucas trocas' }; if (ex > g.max) ex = g.max; }
    msgs = msgs.slice(0, ex * 2);
    for (let q = 0; q < msgs.length; q++) {
      if (msgs[q].role === 'user' && msgs[q].content.length < 2) return { err: 'pergunta vazia' };
      if (msgs[q].role === 'assistant' && msgs[q].content.length < g.minAns) return { err: 'resposta curta' };
      if (msgs[q].role === 'assistant' && msgs[q - 1] && msgs[q].content === msgs[q - 1].content) return { err: 'eco' };
    }
    return { conv: (g.sys && sys) ? [sys].concat(msgs) : msgs };
  }
  function convKey(conv) {
    const u = conv.find(function (m) { return m.role === 'user'; });
    return u ? keyOf(u.content) : '';
  }
  function toRecord(conv, fmt) {
    if (fmt === 'sharegpt') return { conversations: conv.map(function (m) { return { from: m.role === 'user' ? 'human' : (m.role === 'assistant' ? 'gpt' : 'system'), value: m.content }; }) };
    return { messages: conv };
  }
  function summarize(drops) {
    const c = {};
    drops.forEach(function (d) { c[d] = (c[d] || 0) + 1; });
    return Object.keys(c).map(function (k) { return c[k] + ' ' + k; }).join(', ');
  }

  /* ================= execução ================= */
  const goBtn = $('go'), progEl = document.querySelector('#prog i');
  const sPacks = $('sPacks'), sConv = $('sConv'), sDrop = $('sDrop'), sTime = $('sTime');
  let running = false, stopFlag = false, abortCtl = null, timerId = 0;
  const st = { done: 0, total: 0, conv: 0, drop: 0, t0: 0 };

  function setGo(on) {
    goBtn.classList.toggle('stop', on);
    goBtn.innerHTML = (on ? SVG_STOP : SVG_PLAY) + '<span>' + (on ? 'Parar' : 'Iniciar') + '</span>';
  }
  setGo(false);
  function renderStats() {
    sPacks.textContent = st.done + '/' + st.total;
    sConv.textContent = st.conv;
    sDrop.textContent = st.drop;
    sTime.textContent = st.t0 ? fmtTime((performance.now() - st.t0) / 1000) : '0s';
    progEl.style.width = (st.total ? Math.min(100, st.done / st.total * 100) : 0) + '%';
  }
  renderStats();

  function setRunUI(on) {
    setGo(on);
    $('pbox').classList.toggle('locked', on);
    clipBtn.disabled = on; dlBtn.disabled = on;
  }
  function stopAll() { if (!running) return; stopFlag = true; if (abortCtl) abortCtl.abort(); }
  async function sleepStop(ms) { for (let t = 0; t < ms && !stopFlag; t += 200) await sleep(200); }

  async function commitPack(r, g, tp, stream, info) {
    const ex = extractConversations(r.text);
    if (!ex.list.length) throw new RetryError('o modelo não devolveu JSON utilizável' + (r.finish === 'length' ? ' (resposta cortada pelo limite de tokens)' : ''));
    const valid = [], drops = [];
    for (let i = 0; i < ex.list.length; i++) {
      if (valid.length >= g.per) break;
      const out = normalizeConv(ex.list[i], g);
      if (out.err) { drops.push(out.err); continue; }
      const key = convKey(out.conv);
      if (g.dedupe && key && ds.seen.has(key)) { drops.push('duplicada'); continue; }
      if (key) ds.seen.add(key);
      valid.push(out.conv);
    }
    if (!valid.length) throw new RetryError('nenhuma conversa passou na validação' + (drops.length ? ' (' + summarize(drops) + ')' : ''));

    // troca o JSON cru do streaming por uma transcrição legível das conversas do pack
    if (stream && stream.el && stream.el.parentNode) stream.el.parentNode.removeChild(stream.el);
    valid.forEach(function (c, i) {
      const trocas = c.filter(function (m) { return m.role === 'user'; }).length;
      tprint([['── conversa ' + (i + 1) + '/' + valid.length + ' · ' + trocas + (trocas > 1 ? ' trocas' : ' troca'), 't-dim']]);
      c.forEach(function (m) {
        const lab = m.role === 'user' ? 'user      ' : (m.role === 'assistant' ? 'assistant ' : 'system    ');
        tprint([[lab + '▸ ', m.role === 'assistant' ? 't-ok' : 't-dim'], [cut(m.content.replace(/\s+/g, ' '), 240)]]);
      });
    });

    const recs = valid.map(function (c) {
      const rec = toRecord(c, g.fmt);
      if (g.meta) rec.meta = { pack: info.n, model: info.model, temperature: typeof cfg.sys.temp === 'number' ? cfg.sys.temp : null, created: new Date().toISOString() };
      return rec;
    });
    recs.forEach(function (rec) { ds.items.push(rec); });
    let where;
    try { where = await persist(); }
    catch (e) { ds.canWrite = false; where = 'mem'; ds.dirty = true; tprint([['! ', 't-warn'], ['não consegui gravar no arquivo (' + (e.message || e) + '); seguindo em memória.']]); }
    refreshFileUI();

    st.done++; st.conv += valid.length; st.drop += drops.length; renderStats();
    const secs = ((performance.now() - tp) / 1000).toFixed(1);
    tprint('');
    tprint([['✓ ', 't-ok'], [valid.length + ' conversas válidas'], [drops.length ? ' · ' + drops.length + ' descartadas (' + summarize(drops) + ')' : '', 't-warn'], [' · ' + secs + 's', 't-dim']]);
    if (ex.method === 'repaired') tprint([['↻ ', 't-warn'], ['JSON malformado: reparado automaticamente (' + ex.list.length + ' conversas lidas).', 't-warn']]);
    else if (ex.method === 'tolerant') tprint([['↻ ', 't-warn'], ['JSON quebrado: extraí ' + ex.list.length + ' conversas do texto' + (r.finish === 'length' ? ' (resposta cortada pelo limite de tokens)' : '') + '.', 't-warn']]);
    tprint([['json ▸ ', 't-hd'], ['+' + valid.length + ' · total ' + ds.items.length + ' · ' + fmtBytes(ds.bytes) + ' · ' + (where === 'file' ? 'gravado em ' + ds.name : 'atualizado em memória'), 't-dim']]);
    if (where === 'mem' && !ds.warnedMem) { ds.warnedMem = true; tprint('  sem gravação direta: baixe o arquivo com o botão de download ao lado do clipe.', 't-dim'); }
    const lines = JSON.stringify(recs[0], null, 2).split('\n');
    lines.slice(0, 10).forEach(function (l) { tprint('+ ' + cut(l, 100), 't-add'); });
    if (lines.length > 10) tprint('  … +' + (lines.length - 10) + ' linhas', 't-dim');
    if (recs.length > 1) tprint('  … +' + (recs.length - 1) + ' registros', 't-dim');
    return valid.length;
  }

  async function run() {
    if (running) return;
    const g = readGen();
    const total = clamp(qtyEl.value, 1, 999);
    qtyEl.value = total;
    if (!g.prompt) { tprint([['✗ ', 't-err'], ['escreva o prompt de geração antes de iniciar.']]); promptEl.focus(); return; }
    let ep;
    try { ep = endpoint(); } catch (e) { tprint([['✗ ', 't-err'], [e.message]]); return; }

    running = true; stopFlag = false;
    await ensureWrite();
    setRunUI(true); closePanel();
    st.done = 0; st.total = total; st.conv = 0; st.drop = 0; st.t0 = performance.now(); renderStats();
    timerId = setInterval(renderStats, 1000);
    startThinking();

    tprint('');
    tprint([['● ', 't-ok'], ['iniciando ' + total + ' pack' + (total > 1 ? 's' : ''), 't-hd'], [' · ' + NAMES[ep.id] + ' · ' + ep.model + ' · ' + (typeof cfg.sys.temp === 'number' ? 'temp ' + cfg.sys.temp.toFixed(1) : 'temp padrão'), 't-dim']]);
    tprint([['  ' + (g.mode === 'single' ? 'single-shot' : 'multiturno (' + g.min + '–' + g.max + ' trocas)') + ' · ' + g.per + ' conversas/pack · ' + g.lang + ' · ' + (g.fmt === 'sharegpt' ? 'sharegpt' : 'messages') + (g.sys ? ' · com system' : '') + (g.dedupe ? ' · sem repetição' : ''), 't-dim']]);
    if (!ds.loaded) tprint('  nenhum arquivo selecionado: começando um dataset novo em memória.', 't-dim');

    let fatal = null, failed = 0;
    for (let n = 1; n <= total && !stopFlag && !fatal; n++) {
      tprint('');
      tprint([['▸ pack ' + n + '/' + total, 't-hd'], ['  gerando…', 't-dim']]);
      let ok = false;
      for (let attempt = 1; attempt <= 3 && !stopFlag; attempt++) {
        const tp = performance.now();
        let lastPulse = 0;
        const stream = tstream();
        abortCtl = new AbortController();
        try {
          const r = await streamChat(buildMessages(n, total, g), abortCtl.signal, function (t) {
            stream.append(t);
            const now = performance.now();
            if (now - lastPulse > 70) { lastPulse = now; pulseChar(t.trim().slice(-1), 0.02); }
          });
          await commitPack(r, g, tp, stream);
          ok = true; burst(3, 0.035);
          break;
        } catch (err) {
          if (stopFlag || (err && err.name === 'AbortError')) break;
          tprint('');
          if (err instanceof FatalError || (err instanceof HttpError && [400, 401, 403, 404].indexOf(err.status) >= 0)) {
            fatal = err;
            tprint([['✗ ', 't-err'], [err.message, 't-err']]);
            if (/temperature/i.test(err.message)) tprint('  dica: este modelo pode não aceitar temperatura personalizada. Abra o ícone de temperatura e clique em "Padrão".', 't-dim');
            break;
          }
          if (err instanceof TypeError) {
            fatal = err;
            tprint([['✗ ', 't-err'], ['falha de conexão. Verifique o endereço, a internet e o CORS do servidor.', 't-err']]);
            break;
          }
          if (attempt < 3) {
            tprint([['! ', 't-warn'], ['tentativa ' + attempt + '/3 falhou: ' + (err.message || err) + ' — tentando de novo', 't-warn']]);
            await sleepStop(1500 * attempt);
          } else {
            tprint([['✗ ', 't-err'], ['pack ' + n + ' falhou após 3 tentativas: ' + (err.message || err), 't-err']]);
          }
        }
      }
      if (!ok && !stopFlag && !fatal) failed++;
    }

    clearInterval(timerId);
    renderStats();
    stopThinking();
    tprint('');
    if (stopFlag) tprint([['■ interrompido', 't-warn'], [' — ' + st.done + '/' + total + ' packs concluídos · ' + st.conv + ' conversas · o pack em andamento foi descartado', 't-dim']]);
    else if (fatal) tprint([['■ encerrado por erro', 't-err'], [' — ' + st.done + '/' + total + ' packs concluídos · ' + st.conv + ' conversas', 't-dim']]);
    else { tprint([['■ concluído', 't-ok'], [' — ' + st.done + '/' + total + ' packs' + (failed ? ' (' + failed + ' falharam)' : '') + ' · ' + st.conv + ' conversas · ' + st.drop + ' descartadas · ' + fmtTime((performance.now() - st.t0) / 1000), 't-dim']]); burst(8, 0.06); }
    tprint([['  ' + ds.name + ' · ' + ds.items.length + ' itens · ' + fmtBytes(ds.bytes), 't-dim']]);
    if (ds.dirty) tprint('  lembre-se de baixar o arquivo: o resultado está só em memória.', 't-dim');
    tprint('');
    abortCtl = null; running = false; stopFlag = false;
    setRunUI(false);
  }

  goBtn.addEventListener('click', function () { if (running) stopAll(); else run(); });
  promptEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !running) { e.preventDefault(); run(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (openId) closePanel(); else if (running) stopAll();
  });

  /* ================= crédito e início ================= */
  const CREDIT_URL = '';   // coloque aqui o link do perfil para o nome virar um link
  if (CREDIT_URL) { const a = $('creditLink'); a.href = CREDIT_URL; a.target = '_blank'; a.rel = 'noopener noreferrer'; }

  updateButtons();
  tprint([['Selene', 't-hd'], [' · dataset forge', 't-dim']]);
  tprint('1. selecione (opcional) o JSON a editar, no clipe da esfera;', 't-dim');
  tprint('2. escolha o provedor e a temperatura;', 't-dim');
  tprint('3. escreva o prompt de geração, defina a quantidade de packs e pressione Iniciar.', 't-dim');
  tprint('');
})();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Área inferior: mensagens + campo de texto */
  #dock {
    position: fixed;
    left: 50%;
    bottom: 5vh;
    transform: translateX(-50%);
    width: min(720px, 88vw);
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  #chat {
    max-height: 32vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #cfe6d6 transparent;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #cfe6d6; border-radius: 6px; }

  #user {
    max-width: 60ch;
    margin: 0 auto;
    font-size: 13.5px;
    line-height: 1.45;
    color: #9aaba1;
    opacity: 0;
    transition: opacity .5s ease;
    text-wrap: balance;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: break-word;
  }

  /* Resposta do modelo: coluna com largura de leitura confortável */
  #reply {
    width: 100%;
    max-width: 66ch;
    margin: 0 auto;
    box-sizing: border-box;
    text-align: left;
    font-size: clamp(15px, 0.9vw + 11px, 17px);
    line-height: 1.7;
    color: #1f3d2b;
    opacity: 0;
    transition: opacity .6s ease;
    text-wrap: pretty;
    overflow-wrap: break-word;
  }
  #reply.short { text-align: center; text-wrap: balance; }
  #reply > :first-child { margin-top: 0; }
  #reply > :last-child { margin-bottom: 0; }
  #reply p { margin: 0 0 .85em; }
  #reply h1, #reply h2, #reply h3, #reply h4, #reply h5, #reply h6 {
    margin: 1.1em 0 .4em; font-weight: 600; color: #14532d; letter-spacing: .01em; line-height: 1.3;
  }
  #reply h1 { font-size: 1.35em; }
  #reply h2 { font-size: 1.2em; }
  #reply h3, #reply h4, #reply h5, #reply h6 { font-size: 1.05em; }
  #reply ul, #reply ol { margin: 0 0 .85em; padding-left: 1.3em; }
  #reply li { margin: .2em 0; padding-left: .15em; }
  #reply li::marker { color: #22c55e; }
  #reply strong { color: #14532d; font-weight: 600; }
  #reply a { color: #16a34a; text-decoration: underline; text-underline-offset: 3px; }
  #reply code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88em;
    background: #f1f8f3;
    color: #14532d;
    padding: .12em .4em;
    border-radius: 6px;
  }
  #reply pre {
    margin: 0 0 .9em;
    padding: 12px 14px;
    background: #f4faf6;
    border-radius: 12px;
    overflow-x: auto;
    text-align: left;
  }
  #reply pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; }
  #reply table { width: 100%; margin: 0 0 .9em; border-collapse: collapse; font-size: .92em; }
  #reply th, #reply td { padding: 7px 10px; border: 1px solid #e3f0e7; text-align: left; }
  #reply th { background: #f1f8f3; color: #14532d; font-weight: 600; }
  #reply blockquote { margin: 0 0 .85em; padding: .2em 0 .2em 1em; border-left: 2px solid #86d9a3; color: #52705d; }
  #reply hr { border: 0; border-top: 1px solid #e3f0e7; margin: 1em 0; }
  #reply .katex-display { overflow-x: auto; overflow-y: hidden; padding: .3em 0; }

  #msg {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: #14532d;
    caret-color: #22c55e;
    font-family: inherit;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.3;
    text-align: center;
  }
  #msg::placeholder { color: #a9c4b3; }

  /* Barra de mensagem: anexar · texto · microfone */
  #bar { display: flex; align-items: center; gap: 4px; }
  #bar #msg { flex: 1; min-width: 0; width: auto; }
  .ibtn {
    flex: none;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #8fb79c;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .2s, color .2s;
  }
  .ibtn:hover { background: #f1f8f3; color: #14532d; }
  .ibtn:disabled { opacity: .4; cursor: not-allowed; background: transparent; color: #8fb79c; }
  .ibtn svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ibtn.rec { background: #22c55e; color: #fff; animation: recpulse 1.6s infinite; }
  @keyframes recpulse {
    0%   { box-shadow: 0 0 0 0 rgba(34, 197, 94, .45); }
    70%  { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  /* Botão de parar */
  .ibtn.stop { background: #22c55e; color: #fff; }
  .ibtn.stop:hover { background: #16a34a; color: #fff; }
  .ibtn.stop svg rect { fill: currentColor; stroke: none; }
  #reply .cutnote {
    margin-top: .6em;
    color: #9aaba1;
    font-size: .82em;
    font-style: italic;
    letter-spacing: .02em;
  }

  /* Anexos selecionados */
  #chips { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #chips.has { display: flex; }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 220px;
    padding: 5px 6px 5px 10px;
    border-radius: 999px;
    background: #f1f8f3;
    color: #14532d;
    font-size: 12px;
  }
  .chip img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip button {
    border: 0;
    background: transparent;
    color: #7d9a89;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 5px;
    border-radius: 50%;
  }
  .chip button:hover { color: #14532d; }

  /* Crédito */
  #credit {
    margin-top: -4px;
    text-align: center;
    font-size: 10.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #b5cfbe;
    user-select: none;
  }
  #credit a {
    margin-left: .5em;
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 15px;
    letter-spacing: .05em;
    text-transform: none;
    color: #000;
    text-decoration: none;
    transition: color .2s;
  }
  #credit a[href]:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* Nome (canto superior esquerdo) */
  #brand {
    position: fixed;
    top: 14px;
    left: 24px;
    z-index: 5;
    font-family: 'Cormorant Garamond', 'Cormorant', Georgia, 'Times New Roman', serif;
    font-size: 30px;
    font-weight: 400;
    font-style: italic;
    letter-spacing: .04em;
    line-height: 38px;
    color: #14532d;
    user-select: none;
  }
  @media (max-width: 520px) {
    #brand { left: 72px; font-size: 25px; }
  }

  #brand { left: 76px; }
  #selene-nav {
    position: fixed; top: 14px; left: 18px; z-index: 10000;
    color: #1f3d2b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #selene-nav button {
    width: 42px; height: 42px; padding: 0; border: 1px solid rgba(227, 240, 231, .9);
    border-radius: 50%; background: rgba(255, 255, 255, .88); color: #14532d;
    display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 4px 16px rgba(20, 83, 45, .08);
    backdrop-filter: blur(12px); transition: background .2s, box-shadow .2s, transform .2s;
  }
  #selene-nav button:hover, #selene-nav.open button {
    background: #f1f8f3; box-shadow: 0 6px 20px rgba(20, 83, 45, .12);
  }
  #selene-nav button:active { transform: scale(.96); }
  #selene-nav button:focus-visible, #selene-nav a:focus-visible {
    outline: 2px solid #86d9a3; outline-offset: 3px;
  }
  #selene-nav button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
  #selene-nav .selene-menu-panel {
    position: absolute; top: 52px; left: 0; width: 232px; padding: 10px;
    border: 1px solid #e3f0e7; border-radius: 18px; background: rgba(255, 255, 255, .96);
    box-shadow: 0 16px 42px rgba(20, 83, 45, .14); backdrop-filter: blur(16px);
    opacity: 0; visibility: hidden; pointer-events: none; transform: translateY(-7px) scale(.98);
    transform-origin: top left; transition: opacity .2s ease, transform .2s ease, visibility .2s;
  }
  #selene-nav.open .selene-menu-panel { opacity: 1; visibility: visible; pointer-events: auto; transform: none; }
  #selene-nav .selene-menu-title {
    margin: 4px 9px 8px; color: #9aaba1; font-size: 10px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
  }
  #selene-nav a {
    display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 12px;
    color: #52705d; font-size: 13px; text-decoration: none; transition: background .18s, color .18s;
  }
  #selene-nav a:hover, #selene-nav a[aria-current="page"] { background: #f1f8f3; color: #14532d; }
  #selene-nav a[aria-current="page"] { font-weight: 600; }
  #selene-nav a svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  body.selene-page-leaving { opacity: 0; transition: opacity .18s ease; }
  @media (prefers-reduced-motion: no-preference) {
    body { animation: selene-page-enter .28s ease; }
    @keyframes selene-page-enter { from { opacity: 0; } to { opacity: 1; } }
  }
  @media (prefers-reduced-motion: reduce) {
    #selene-nav .selene-menu-panel, #selene-nav a, #selene-nav button { transition: none; }
  }

  /* Ícones de provedores (canto superior direito) */
  #tools {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 5;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #icons { display: flex; gap: 4px; justify-content: flex-end; }
  #side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; margin-top: 4px; }
  .tbtn.warn, .tbtn.warn:hover { background: #fdecec; color: #b91c1c; }
  .tbtn {
    position: relative;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #8fb79c;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .2s, color .2s;
  }
  .tbtn:hover, .tbtn.sel { background: #f1f8f3; color: #14532d; }
  .tbtn:disabled { opacity: .42; cursor: not-allowed; }
  .tbtn:disabled:hover { background: transparent; color: #8fb79c; }
  .tbtn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .tbtn.on::after {
    content: '';
    position: absolute;
    right: 6px;
    top: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
  }

  #panel {
    position: absolute;
    top: 100%;
    margin-top: 8px;
    right: 0;
    width: min(300px, 86vw);
    box-sizing: border-box;
    padding: 18px;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 10px 36px rgba(20, 83, 45, .14);
    font-size: 13px;
    color: #1f3d2b;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  #panel.open { opacity: 1; transform: none; pointer-events: auto; }
  #panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #14532d; }
  #panel label { display: block; margin-bottom: 12px; color: #7d9a89; font-size: 12px; }
  #panel input, #panel select, #panel textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    padding: 9px 12px;
    border: 0;
    outline: 0;
    border-radius: 10px;
    background: #f1f8f3;
    color: #14532d;
    font: inherit;
    font-size: 13px;
  }
  #panel input:focus, #panel select:focus, #panel textarea:focus { background: #e8f5ec; }
  #panel textarea { resize: vertical; min-height: 96px; max-height: 40vh; line-height: 1.5; }
  #panel .rowtop { display: flex; justify-content: space-between; align-items: baseline; }
  #panel #f-tval { color: #14532d; font-weight: 600; }
  #panel input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    padding: 0;
    margin-top: 14px;
    background: #dcefe2;
    border-radius: 4px;
    cursor: pointer;
  }
  #panel input[type=range]:focus { background: #dcefe2; }
  #panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #22c55e;
    border: 0;
  }
  #panel input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #22c55e;
    border: 0;
  }
  #panel .row { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
  #panel .row select { margin-top: 0; flex: 1; min-width: 0; }
  #panel button {
    border: 0;
    border-radius: 10px;
    padding: 9px 14px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  #panel .primary { background: #22c55e; color: #fff; }
  #panel .primary:hover { background: #16a34a; }
  #panel .ghost { background: transparent; color: #7d9a89; }
  #panel .ghost:hover { background: #f1f8f3; color: #14532d; }
  #panel .actions { display: flex; gap: 6px; margin-top: 4px; }
  #panel .hint, #panel .status {
    margin-top: 10px;
    font-size: 11.5px;
    line-height: 1.45;
    color: #9aaba1;
  }
  #panel .status.error { color: #b91c1c; }
</style>
</head>
<body>
<div id="selene-nav">
  <button type="button" aria-label="Abrir menu de navegação" aria-expanded="false" aria-controls="selene-menu">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <nav class="selene-menu-panel" id="selene-menu" aria-label="Navegação Selene">
    <div class="selene-menu-title">Explorar Selene</div>

      <span>Assistente</span>

    <a href="selene-datasets.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.1 7.6 3 12 3s8 1.1 8 2.5S16.4 8 12 8 4 6.9 4 5.5Z"/><path d="M4 5.5v6C4 12.9 7.6 14 12 14s8-1.1 8-2.5v-6M4 11.5v7C4 19.9 7.6 21 12 21s8-1.1 8-2.5v-7"/></svg>

      <span>LoRA Forge</span>
    </a>
    <a href="Selene-Gateway.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3.2v5.8c0 5-3.2 8.5-7.5 10-4.3-1.5-7.5-5-7.5-10V5.7L12 2.5z"/><path d="M8.7 12.2l2.3 2.3 4.4-4.7"/></svg>
      <span>Selene Gateway</span>
    </a>
    <a href="cripto-Prompt.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20V5a1.5 1.5 0 0 1 1-1.5Z"/><path d="M14 3.5V8h4M9 12h6M9 16h6"/></svg>
      <span>Cripto-Prompt</span>
    </a>
  </nav>
</div>
<canvas id="c"></canvas>

<div id="brand">Selene</div>

<div id="tools">
  <div id="icons">
    <button class="tbtn" data-id="gemini" type="button" title="Google (Gemini)" aria-label="Google (Gemini)">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/></svg>
    </button>
    <button class="tbtn" data-id="openai" type="button" title="OpenAI (GPT)" aria-label="OpenAI (GPT)">
      <svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 16.5v3M17 18h3"/></svg>
    </button>
    <button class="tbtn" data-id="groq" type="button" title="Groq" aria-label="Groq">
      <svg viewBox="0 0 24 24"><path d="M13 3L5 13h6l-1 8 8-10h-6z"/></svg>
    </button>
    <button class="tbtn" data-id="llama" type="button" title="Llama local" aria-label="Llama local">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="6" rx="2"/><rect x="4" y="13" width="16" height="6" rx="2"/><path d="M8 8h.01M8 16h.01"/></svg>
    </button>
    <button class="tbtn" id="gatewayConnect" type="button" title="Selene Gateway" aria-label="Selene Gateway" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3.2v5.8c0 5-3.2 8.5-7.5 10-4.3-1.5-7.5-5-7.5-10V5.7L12 2.5z"/><path d="M8.7 12.2l2.3 2.3 4.4-4.7"/></svg>
    </button>
  </div>
  <div id="side">
    <button class="tbtn" id="clear" type="button" title="Apagar histórico" aria-label="Apagar histórico">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
    </button>
    <button class="tbtn" data-id="sys" type="button" title="Instruções do sistema e temperatura" aria-label="Instruções do sistema e temperatura">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>

  <div id="panel"></div>
</div>

<div id="dock">
  <div id="chat">
    <div id="user"></div>
    <div id="reply"></div>
  </div>
  <div id="chips"></div>
  <div id="bar">
    <button id="attach" class="ibtn" type="button" title="Anexar arquivos" aria-label="Anexar arquivos">
      <svg viewBox="0 0 24 24"><path d="M20 11.5l-7.6 7.6a4.5 4.5 0 0 1-6.4-6.4l8-8a3 3 0 0 1 4.2 4.2l-8 8a1.5 1.5 0 0 1-2.1-2.1l7.4-7.4"/></svg>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const input = document.getElementById('msg');
  const chatEl = document.getElementById('chat');
  const userEl = document.getElementById('user');
  const replyEl = document.getElementById('reply');
  const dockEl = document.getElementById('dock');

  const COUNT = 1800;
  const SPEED_Y = 0.0025;
  const FOCAL = 900;
  const SIGMA = 0.38;          // tamanho da região afetada por cada caractere

  let w, h, dpr, radius, cy;
  let baseR = 0, baseCy = 0, tR = 0, tC = 0, dockTop = 0;   // tamanho/posição da esfera (alvo e base)

  // Distribuição uniforme na esfera (espiral de Fibonacci)
  const points = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < COUNT; i++) {
    const y = 1 - (i / (COUNT - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const theta = golden * i;
    points.push({
      x: Math.cos(theta) * r,
      y: y,
      z: Math.sin(theta) * r,
      phase: Math.random() * Math.PI * 2,
      ox: 0, oy: 0, vx: 0, vy: 0      // deslocamento e velocidade causados pelo mouse
    });
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    baseR = Math.min(w, h) * 0.28;
    baseCy = h * 0.40;
    updateTargets();
    radius = tR;
    cy = h * 0.40;             // esfera um pouco acima do centro, abrindo espaço para as mensagens
  }
  // A esfera só encolhe/sobe o necessário para nunca ficar atrás das mensagens
  function updateTargets() {
    const avail = (dockTop > 0 ? Math.min(dockTop, h) : h) - 20;
    const r = Math.max(60, Math.min(baseR, (avail - 56) / 2.24));
    tR = r;
    tC = Math.min(baseCy, avail - r * 1.12 - 4);
  }
  function measureDock() {
    dockTop = dockEl.getBoundingClientRect().top;
    updateTargets();
  }
  window.addEventListener('resize', function () { resize(); measureDock(); });
  resize();
  measureDock();
  radius = tR;
  cy = tC;
  if (window.ResizeObserver) new ResizeObserver(measureDock).observe(dockEl);

  // ---- Pulsos (reação aos caracteres) ----
  const pulses = [];

  // Cada caractere sempre aponta para a mesma região da esfera
  function regionFor(ch) {
    const code = ch.codePointAt(0);
    const lon = (code * 2.399963) % (Math.PI * 2);
    const v = ((code * 37) % 101) / 100;
    const lat = Math.asin(v * 2 - 1);
    return {
      x: Math.cos(lat) * Math.cos(lon),
      y: Math.sin(lat),
      z: Math.cos(lat) * Math.sin(lon)
    };
  }

  // Cada caractere também tem seu próprio desvio de cor (de azul-esverdeado a amarelo-esverdeado)
  function hueFor(ch) {
    const v = ((ch.codePointAt(0) * 47) % 100) / 100;
    return -35 + v * 80;
  }

  function addPulse(dir, amp, hue) {
    pulses.push({ x: dir.x, y: dir.y, z: dir.z, t0: performance.now(), amp: amp, hue: hue });
    if (pulses.length > 60) pulses.shift();
  }

  // ---- Estado "pensando" ----
  let thinkStart = 0;          // quando começou (0 = inativo)
  let thinkEnd = 0;            // quando terminou (0 = ainda pensando)
  const PLACEHOLDER = input.placeholder;

  function startThinking() {
    thinkStart = performance.now();
    thinkEnd = 0;
    input.placeholder = 'Pensando…';
  }
  function stopThinking() {
    thinkEnd = performance.now();
    input.placeholder = PLACEHOLDER;
  }

  // ---- Conversa ----
  const sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  let busy = false;
  let stopRequested = false;   // o usuário pediu para parar
  let abortCtl = null;         // cancela a requisição em andamento

  // Envia a mensagem ao provedor ativo (OpenAI, Groq ou Llama local) e devolve o texto da resposta.
  const convo = [];   // histórico da conversa

  async function errorText(res) {
    let msg = 'erro ' + res.status;
    try {
      const d = await res.json();
      if (d && d.error && d.error.message) msg += ': ' + d.error.message;
    } catch (e) {}
    return msg;
  }

  // Monta o conteúdo da mensagem: texto + arquivos de texto embutidos + imagens/PDF como partes próprias
  function buildContent(text, files, provider) {
    let block = text;
    const media = [];
    const notes = [];
    files.forEach(function (f) {
      if (f.kind === 'text') {
        block += '\n\n--- Arquivo: ' + f.name + ' ---\n' + f.data + (f.truncated ? '\n[…arquivo truncado]' : '') + '\n--- fim do arquivo ---';
      } else if (f.kind === 'image') {
        media.push({ type: 'image_url', image_url: { url: f.data } });
        notes.push('[imagem: ' + f.name + ']');
      } else if (f.kind === 'pdf') {
        if (provider !== 'openai') throw new Error('PDF só é aceito com o provedor OpenAI nesta versão (' + f.name + ').');
        media.push({ type: 'file', file: { filename: f.name, file_data: f.data } });
        notes.push('[PDF: ' + f.name + ']');
      }
    });
    return {
      content: media.length ? [{ type: 'text', text: block }].concat(media) : block,
      textOnly: notes.length ? block + '\n' + notes.join(' ') : block   // o que fica no histórico
    };
  }

  async function askModel(text, files, onDelta) {
    files = files || [];
    const ctl = new AbortController();
    abortCtl = ctl;
    const id = cfg.active;
    if (id === 'gateway') {
      if (files.some(function (file) { return file.kind !== 'text'; })) {
        throw new Error('O Selene Gateway aceita anexos de texto. Imagens e PDFs não podem ser enviados neste modo.');
      }
      const built = buildContent(text, files, 'gateway');
      if (typeof built.content !== 'string') throw new Error('Não foi possível preparar a mensagem para o Selene Gateway.');
      if (built.content.length > 8000) throw new Error('A mensagem excede o limite de 8.000 caracteres do Selene Gateway.');
      convo.push({ role: 'user', content: built.textOnly });
      const answer = await requestGatewayModel(built.content, ctl.signal, onDelta);
      convo.push({ role: 'assistant', content: answer });
      return answer;
    }
    if (!id) {
      await new Promise(function (resolve, reject) {
        const t = setTimeout(resolve, 1800);
        ctl.signal.addEventListener('abort', function () {
          clearTimeout(t);
          reject(new DOMException('Cancelado', 'AbortError'));
        });
      });
      return 'Nenhum provedor ativo ainda. Clique em um dos ícones no canto superior direito, configure e salve para conversar de verdade.';
    }

    const headers = { 'Content-Type': 'application/json' };
    let url, model;
    if (id === 'openai') {
      if (!cfg.openai.key) throw new Error('falta a chave da OpenAI.');
      url = 'https://api.openai.com/v1/chat/completions';
      headers.Authorization = 'Bearer ' + cfg.openai.key;
      model = cfg.openai.model || 'gpt-4o-mini';
    } else if (id === 'gemini') {
      if (!cfg.gemini.key) throw new Error('falta a chave do Gemini.');
      url = 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions';
      headers.Authorization = 'Bearer ' + cfg.gemini.key;
      model = cfg.gemini.model;
    } else if (id === 'groq') {
      if (!cfg.groq.key) throw new Error('falta a chave da Groq.');
      url = 'https://api.groq.com/openai/v1/chat/completions';
      headers.Authorization = 'Bearer ' + cfg.groq.key;
      model = cfg.groq.model;
    } else {
      let base = (cfg.llama.url || '').trim().replace(/\/+$/, '');
      if (!base) throw new Error('falta o endereço da API do Llama.');
      if (!/^https?:\/\//i.test(base)) base = 'http://' + base;
      url = /\/v1$/.test(base) ? base + '/chat/completions' : base + '/v1/chat/completions';
      model = cfg.llama.model || 'local';
    }

    const built = buildContent(text, files, id);
    const idx = convo.length;
    convo.push({ role: 'user', content: built.content });
    let reply = '';
    try {
      const sysPrompt = (cfg.sys.prompt || '').trim();
      const payload = {
        model: model,
        messages: (sysPrompt ? [{ role: 'system', content: sysPrompt }] : []).concat(convo.slice(-20)),
        stream: true
      };
      if (typeof cfg.sys.temp === 'number') payload.temperature = cfg.sys.temp;
      const res = await fetch(url, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(payload),
        signal: ctl.signal
      });
      if (!res.ok) throw new Error(await errorText(res));
      function emit(content) {
        if (typeof content === 'string') return content;
        if (!Array.isArray(content)) return '';
        return content.map(function (part) {
          return part && typeof part.text === 'string' ? part.text : '';
        }).join('');
      }

      const contentType = res.headers.get('content-type') || '';
      if (/text\/event-stream/i.test(contentType) && res.body) {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '', eventData = [], finished = false;

        function dispatchEvent() {
          if (!eventData.length) return;
          const data = eventData.join('\n');
          eventData = [];
          if (data === '[DONE]') { finished = true; return; }
          let message;
          try { message = JSON.parse(data); }
          catch (err) { throw new Error('resposta SSE inválida recebida do provedor.'); }
          if (message.error) {
            throw new Error(message.error.message || 'erro retornado pelo provedor.');
          }
          const choice = message.choices && message.choices[0];
          const delta = choice && choice.delta && emit(choice.delta.content);
          if (delta) {
            reply += delta;
            if (onDelta) onDelta(delta, reply);
          }
        }

        function readLine(line) {
          if (line === '') { dispatchEvent(); return; }
          if (line.charAt(0) === ':') return;
          const colon = line.indexOf(':');
          const field = colon < 0 ? line : line.slice(0, colon);
          if (field !== 'data') return;
          let value = colon < 0 ? '' : line.slice(colon + 1);
          if (value.charAt(0) === ' ') value = value.slice(1);
          eventData.push(value);
        }

        try {
          while (!finished) {
            const chunk = await reader.read();
            if (chunk.done) break;
            buffer += decoder.decode(chunk.value, { stream: true });
            let newline;
            while ((newline = buffer.indexOf('\n')) >= 0) {
              const line = buffer.slice(0, newline).replace(/\r$/, '');
              buffer = buffer.slice(newline + 1);
              readLine(line);
              if (finished) break;
            }
          }
          buffer += decoder.decode();
          if (!finished) {
            if (buffer) readLine(buffer.replace(/\r$/, ''));
            dispatchEvent();
          }
        } finally {
          reader.releaseLock();
        }
      } else {
        const data = await res.json();
        const choice = data.choices && data.choices[0];
        reply = emit(choice && choice.message && choice.message.content);
        if (reply && onDelta) onDelta(reply, reply);
      }
      if (!reply.trim()) throw new Error('a resposta veio vazia.');
      convo[idx].content = built.textOnly;   // imagens/PDF não são reenviados nos próximos turnos
      convo.push({ role: 'assistant', content: reply });
      return reply;
    } catch (err) {
      if (err && err.name !== 'AbortError' && typeof reply === 'string' && reply.trim()) {
        convo[idx].content = built.textOnly;
        convo.push({ role: 'assistant', content: reply });
      } else {
        convo.pop();
      }
      if (err instanceof TypeError) {
        throw new Error('falha de conexão. Verifique o endereço, a internet e o CORS.');
      }
      throw err;
    }
  }

  // ---- Formatação da resposta (Markdown básico, sempre escapado) ----
  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inline(raw) {
    const codes = [];
    let s = esc(raw).replace(/`([^`]+)`/g, function (m, c) {
      codes.push(c);
      return '\u0000' + (codes.length - 1) + '\u0000';
    });
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, function (m, i) { return '<code>' + codes[i] + '</code>'; });
  }

  function renderMarkdownFallback(src) {
    const lines = src.replace(/\r/g, '').split('\n');
    const ulRe = /^\s*[-*•]\s+/, olRe = /^\s*\d+[.)]\s+/, hRe = /^#{1,3}\s+/;
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }
      if (!line.trim()) { i++; continue; }
      if (hRe.test(line)) {
        out.push('<h4>' + inline(line.replace(hRe, '')) + '</h4>');
        i++;
        continue;
      }
      if (ulRe.test(line) || olRe.test(line)) {
        const ordered = olRe.test(line);
        const re = ordered ? olRe : ulRe;
        const items = [];
        while (i < lines.length && re.test(lines[i])) {
          items.push('<li>' + inline(lines[i].replace(re, '')) + '</li>');
          i++;
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^```/.test(lines[i]) &&
             !hRe.test(lines[i]) && !ulRe.test(lines[i]) && !olRe.test(lines[i])) {
        para.push(lines[i]);
        i++;
      }
      out.push('<p>' + inline(para.join(' ')) + '</p>');
    }
    return out.join('');
  }

  function renderMarkdown(src, renderMath) {
    if (!window.marked || !window.DOMPurify || typeof window.marked.parse !== 'function') {
      return renderMarkdownFallback(src);
    }
    const html = window.marked.parse(src, { gfm: true, breaks: false });
    const safeHtml = window.DOMPurify.sanitize(html, {
      FORBID_TAGS: ['img', 'svg', 'iframe', 'video', 'audio']
    });
    if (renderMath && window.renderMathInElement) {
      const container = document.createElement('div');
      container.innerHTML = safeHtml;
      window.renderMathInElement(container, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false }
        ],
        ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      });
      return container.innerHTML;
    }
    return safeHtml;
  }

  function streamReply(text, interrupted) {
    replyEl.classList.toggle('short', text.length <= 110 && text.indexOf('\n') < 0);
    replyEl.style.opacity = 1;
    replyEl.innerHTML = renderMarkdown(text, true);
    if (interrupted) replyEl.insertAdjacentHTML('beforeend', '<div class="cutnote">interrompido</div>');
    chatEl.scrollTop = chatEl.scrollHeight;
    return text;
  }

  async function send(text) {
    busy = true;
    stopListening();
    stopRequested = false;
    setBusyUI(true);
    const files = attached.slice();
    attached.length = 0;
    renderChips();
    input.value = '';
    prev = '';

    userEl.textContent = text + (files.length ? ' · anexos: ' + files.map(function (f) { return f.name; }).join(', ') : '');
    userEl.style.opacity = 1;
    replyEl.style.opacity = 0;
    replyEl.innerHTML = '';

    startThinking();
    let answer, streamedAnswer = '', renderFrame = 0, lastPulseAt = 0;
    const before = convo.length;
    try {
      answer = await askModel(text, files, function (delta, fullText) {
        streamedAnswer = fullText;
        replyEl.classList.toggle('short', fullText.length <= 110 && fullText.indexOf('\n') < 0);
        replyEl.style.opacity = 1;
        if (!renderFrame) {
          renderFrame = requestAnimationFrame(function () {
            renderFrame = 0;
            replyEl.innerHTML = renderMarkdown(streamedAnswer, false);
            chatEl.scrollTop = chatEl.scrollHeight;
          });
        }
        const now = performance.now();
        const ch = Array.from(delta).pop();
        if (ch && ch.trim() && now - lastPulseAt > 70) {
          addPulse(regionFor(ch), 0.025, hueFor(ch));
          lastPulseAt = now;
        }
      });
    } catch (err) {
      if (err && err.name === 'AbortError' && !streamedAnswer) {
        // cancelado enquanto esperava: devolve o texto e os anexos para editar
        stopThinking();
        userEl.style.opacity = 0;
        input.value = text;
        prev = text;
        attached.push.apply(attached, files);
        renderChips();
        replyEl.classList.add('short');
        replyEl.style.opacity = 1;
        replyEl.innerHTML = '<div class="cutnote">cancelado</div>';
        busy = false;
        setBusyUI(false);
        input.focus();
        return;
      }
      if (err && err.name === 'AbortError') {
        answer = streamedAnswer;
        if (convo.length === before) {
          const built = buildContent(text, files, cfg.active);
          convo.push({ role: 'user', content: built.textOnly });
          convo.push({ role: 'assistant', content: answer });
        }
      } else {
        answer = streamedAnswer
          ? streamedAnswer + '\n\n> A resposta foi interrompida: ' + err.message
          : 'Não consegui obter a resposta: ' + err.message;
        if (convo.length > before && convo[convo.length - 1].role === 'assistant') {
          convo[convo.length - 1].content = answer;
        }
      }
    }
    stopThinking();
    if (renderFrame) cancelAnimationFrame(renderFrame);
    const shown = streamReply(answer, stopRequested);
    // se foi interrompida, o histórico guarda só o que apareceu na tela
    if (stopRequested && convo.length > before && convo[convo.length - 1].role === 'assistant') {
      convo[convo.length - 1].content = shown.trim() ? shown : '(resposta interrompida)';
    }
    busy = false;
    setBusyUI(false);
    input.focus();
  }

  let prev = '';
  input.addEventListener('input', function () {
    const val = input.value;
    if (val.length > prev.length) {
      for (const ch of Array.from(val.slice(prev.length))) {
        addPulse(regionFor(ch), 0.06, hueFor(ch));
      }
    } else if (val.length < prev.length) {
      for (const ch of Array.from(prev.slice(val.length))) {
        addPulse(regionFor(ch), -0.04, hueFor(ch));
      }
    }
    prev = val;
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !busy) {
      const text = input.value.trim();
      if (text || attached.length) send(text || 'Descreva e resuma o conteúdo do anexo.');
    }
  });

  // ---- Provedores: configuração (chaves, modelo, endereço) ----
  const STORE_KEY = 'esfera.provedores';
  const GROQ_FALLBACK = ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant'];
  const GEMINI_FALLBACK = ['gemini-2.5-flash', 'gemini-2.5-pro', 'gemini-2.0-flash'];
  const MODELS_URL = {
    groq: 'https://api.groq.com/openai/v1/models',
    gemini: 'https://generativelanguage.googleapis.com/v1beta/openai/models'
  };
  const DEFAULT_CFG = {
    gemini: { key: '', model: 'gemini-2.5-flash', models: [] },
    openai: { key: '', model: 'gpt-4o-mini' },
    groq:   { key: '', model: 'llama-3.3-70b-versatile', models: [] },
    llama:  { url: 'http://localhost:11434', model: '' },
    sys:    { prompt: '', temp: null },     // temp null = padrão do modelo
    gateway:{ route: '', accessCode: '' }
  };
  const TITLES = { gemini: 'Google · Gemini', openai: 'OpenAI · GPT', groq: 'Groq', llama: 'Llama local', sys: 'Instruções e temperatura' };

  function loadCfg() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; } catch (e) {}
    return {
      active: saved.active || null,
      gemini: Object.assign({}, DEFAULT_CFG.gemini, saved.gemini),
      openai: Object.assign({}, DEFAULT_CFG.openai, saved.openai),
      groq:   Object.assign({}, DEFAULT_CFG.groq,   saved.groq),
      llama:  Object.assign({}, DEFAULT_CFG.llama,  saved.llama),
      sys:    Object.assign({}, DEFAULT_CFG.sys,    saved.sys),
      gateway:Object.assign({}, DEFAULT_CFG.gateway,saved.gateway)
    };
  }
  function saveCfg() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(cfg)); } catch (e) {}
  }
  const cfg = loadCfg();

  const toolsEl = document.getElementById('tools');
  const panelEl = document.getElementById('panel');
  const gatewayBtn = document.getElementById('gatewayConnect');
  const tbtns = Array.prototype.slice.call(toolsEl.querySelectorAll('.tbtn[data-id]'));
  let openId = null;
  const GATEWAY_PROTOCOL_VERSION = 3;
  let gatewayPeer = null;
  let gatewayConn = null;
  let gatewayConnectPromise = null;
  let gatewayConnectCancel = null;
  let gatewayConnectingRoute = '';
  let gatewayConnectingAccessCode = '';
  let gatewayConnectedRoute = '';
  let gatewayConnectedAccessCode = '';
  let gatewayPending = null;

  function $(sel) { return panelEl.querySelector(sel); }

  function updateButtons() {
    const gatewayActive = cfg.active === 'gateway';
    if (gatewayActive && openId === 'sys') {
      openId = null;
      panelEl.classList.remove('open');
      panelEl.innerHTML = '';
    }
    tbtns.forEach(function (b) {
      // provedor ativo ou, no botão de instruções, "há um system prompt salvo"
      b.classList.toggle('on', b.dataset.id === 'sys' ? !!String(cfg.sys.prompt || '').trim() : cfg.active === b.dataset.id);
      b.classList.toggle('sel', openId === b.dataset.id);
      if (b.dataset.id === 'sys') {
        b.disabled = gatewayActive;
        b.title = gatewayActive
          ? 'O prompt do sistema e a temperatura são definidos pelo host do Gateway'
          : 'Instruções do sistema e temperatura';
        b.setAttribute('aria-label', b.title);
      }
    });
    gatewayBtn.classList.toggle('on', cfg.active === 'gateway');
    gatewayBtn.classList.toggle('sel', openId === 'gateway');
    gatewayBtn.setAttribute('aria-pressed', String(cfg.active === 'gateway'));
  }

  function fillModels(pid, selected) {
    const sel = $('#f-model');
    const list = cfg[pid].models.length ? cfg[pid].models.slice() : (pid === 'gemini' ? GEMINI_FALLBACK : GROQ_FALLBACK).slice();
    if (selected && list.indexOf(selected) < 0) list.unshift(selected);
    sel.innerHTML = '';
    list.forEach(function (m) {
      const o = document.createElement('option');
      o.value = m;
      o.textContent = m;
      sel.appendChild(o);
    });
    sel.value = selected;
  }

  async function refreshModels(pid) {
    const status = $('#f-status');
    const key = $('#f-key').value.trim();

  function gatewayMessageError(reason) {
    const messages = {
      auth: 'Código de acesso incorreto.',
      busy: 'O host já está atendendo outro convidado.',
      'not-ready': 'O host ainda não foi iniciado.',
      protocol: 'A página do host usa um protocolo incompatível.'

    return messages[reason] || 'O host recusou a conexão.';
  }

  function gatewayStatus(message, isError) {

  function resetGatewayConnection(message) {
    if (gatewayConnectCancel) {
      const cancel = gatewayConnectCancel;
      gatewayConnectCancel = null;
      cancel(new Error(message || 'Conexão cancelada.'));
    }
    const conn = gatewayConn;
    const peer = gatewayPeer;
    gatewayConn = null;
    gatewayPeer = null;
    gatewayConnectPromise = null;
    gatewayConnectingRoute = '';
    gatewayConnectingAccessCode = '';
    gatewayConnectedRoute = '';
    gatewayConnectedAccessCode = '';
    if (gatewayPending) {
      const pending = gatewayPending;
      gatewayPending = null;
      pending.cleanup();
      pending.reject(new Error(message || 'A conexão com o host foi encerrada.'));
    }
    if (conn && conn.open) {
      try { conn.close(); } catch (e) {}
    }
    if (peer && !peer.destroyed) {
      try { peer.destroy(); } catch (e) {}
    }
  }

  function handleGatewayResponse(data) {
    const pending = gatewayPending;
    if (!pending || !data || typeof data !== 'object' || data.requestId !== pending.requestId) return;
    if (data.type === 'ai-start') {
      pending.started = true;
      return;
    }
    if (data.type === 'ai-delta') {
      if (!pending.started || typeof data.text !== 'string' ||
          pending.text.length + data.text.length > 24000 || data.text.length > 3000) return;
      pending.text += data.text;
      if (pending.onDelta) pending.onDelta(data.text, pending.text);
      return;
    }
    if (data.type === 'ai-end') {
      if (!pending.started) return;
      gatewayPending = null;
      pending.cleanup();
      pending.resolve(pending.text);
    } else if (data.type === 'ai-error' && typeof data.message === 'string' && data.message.length <= 1000) {
      gatewayPending = null;
      pending.cleanup();
      const message = /(?:HTTP\s*)503\b|service unavailable/i.test(data.message)
        ? 'O host recebeu sua mensagem, mas o provedor do modelo está indisponível (HTTP 503). Tente novamente em instantes; se persistir, peça ao host para verificar o provedor.'
        : data.message;
      pending.reject(new Error(message));
    }
  }

  function ensureGatewayConnection() {
    const route = String(cfg.gateway.route || '').trim();
    const accessCode = String(cfg.gateway.accessCode || '').trim().toUpperCase();
    if (gatewayConn && gatewayConn.open && gatewayConnectedRoute === route &&
        gatewayConnectedAccessCode === accessCode) return Promise.resolve(gatewayConn);
    if (gatewayConnectPromise && gatewayConnectingRoute === route &&
        gatewayConnectingAccessCode === accessCode) return gatewayConnectPromise;
    if (gatewayConn || gatewayPeer) resetGatewayConnection('Rota do host alterada.');
    if (gatewayConnectPromise) resetGatewayConnection('Configuração da rota alterada.');
    if (!route || route.length > 96 || !/^[A-Za-z0-9]+(?:[ _-][A-Za-z0-9]+)*$/.test(route)) {
      return Promise.reject(new Error('Informe um identificador de rota válido.'));
    }
    if (!/^[a-f0-9]{16}$/i.test(accessCode)) {
      return Promise.reject(new Error('O código de acesso deve ter 16 caracteres hexadecimais.'));
    }
    if (typeof window.Peer !== 'function') {
      return Promise.reject(new Error('Não foi possível carregar a conexão segura PeerJS. Verifique sua internet e recarregue a página.'));
    }

    gatewayConnectPromise = new Promise(function (resolve, reject) {
      let settled = false;
      let handshakeComplete = false;
      let conn = null;
      const timeout = setTimeout(function () { fail(new Error('Tempo esgotado ao conectar ao host.')); }, 18000);

      function cleanup() {
        clearTimeout(timeout);
      }
      function fail(error) {
        if (settled) return;
        settled = true;
        cleanup();
        gatewayConnectPromise = null;
        gatewayConnectCancel = null;
        gatewayConnectingRoute = '';
        gatewayConnectingAccessCode = '';
        if (conn && conn.open) { try { conn.close(); } catch (e) {} }
        if (gatewayPeer && !gatewayPeer.destroyed) { try { gatewayPeer.destroy(); } catch (e) {} }
        gatewayPeer = null;
        gatewayConn = null;
        reject(error);
      }
      function connected() {
        if (settled) return;
        settled = true;
        cleanup();
        gatewayConnectCancel = null;
        gatewayConnectingRoute = '';
        gatewayConnectingAccessCode = '';
        gatewayConn = conn;
        gatewayConnectedRoute = route;
        gatewayConnectedAccessCode = accessCode;
        gatewayConnectPromise = null;
        resolve(conn);
      }

      gatewayConnectingRoute = route;
      gatewayConnectingAccessCode = accessCode;
      gatewayConnectCancel = fail;
      try {
        gatewayPeer = new window.Peer(undefined, { debug: 0 });
      } catch (error) {
        fail(new Error('Não foi possível iniciar a conexão PeerJS.'));
        return;
      }
      const peer = gatewayPeer;
      peer.on('open', function () {
        if (settled) return;
        try {
          conn = peer.connect(route, {
            reliable: true,
            metadata: { protocolVersion: GATEWAY_PROTOCOL_VERSION }
          });
          gatewayConn = conn;
        } catch (error) {
          fail(new Error('Não foi possível abrir a conexão com a rota.'));
          return;
        }
        conn.on('open', function () {
          try {
            conn.send({
              type: 'session-hello',
              protocolVersion: GATEWAY_PROTOCOL_VERSION,
              accessCode: accessCode
            });
          } catch (error) {
            fail(new Error('Não foi possível enviar o acesso ao host.'));
          }
        });
        conn.on('data', function (data) {
          if (!handshakeComplete) {
            if (data && data.type === 'session-accept' && data.protocolVersion === GATEWAY_PROTOCOL_VERSION) {
              handshakeComplete = true;
              connected();
            } else if (data && data.type === 'session-reject') {
              fail(new Error(gatewayMessageError(data.reason)));
            }
            return;
          }
          handleGatewayResponse(data);
        });
        conn.on('close', function () {
          if (settled && gatewayConn === conn) resetGatewayConnection('A conexão com o host foi encerrada.');
          else fail(new Error('O host encerrou a conexão antes de aceitar o acesso.'));
        });
        conn.on('error', function () {
          if (!settled) fail(new Error('Falha ao conectar com o host.'));
          else if (gatewayConn === conn) resetGatewayConnection('A conexão com o host foi interrompida.');
        });
      });
      peer.on('error', function (error) {
        if (!settled) {
          const message = error && error.type === 'peer-unavailable'
            ? 'A rota não foi encontrada ou o host está offline.'
            : 'Falha ao localizar o host na rede PeerJS.';
          fail(new Error(message));
        } else if (gatewayPeer === peer && gatewayConn && !gatewayConn.open) {
          resetGatewayConnection('A conexão com o host foi interrompida.');
        }
      });
    });
    return gatewayConnectPromise;
  }

  function requestGatewayModel(text, signal, onDelta) {
    return ensureGatewayConnection().then(function (conn) {
      return new Promise(function (resolve, reject) {
        if (signal.aborted) {
          reject(new DOMException('Cancelado', 'AbortError'));
          return;
        }
        if (gatewayPending) {
          reject(new Error('Já existe uma resposta em andamento pelo Gateway.'));
          return;
        }
        if (!window.crypto || typeof window.crypto.getRandomValues !== 'function') {
          reject(new Error('Este navegador não pode gerar um identificador seguro para a solicitação.'));
          return;
        }
        const bytes = new Uint8Array(8);
        window.crypto.getRandomValues(bytes);
        const requestId = Array.from(bytes, function (byte) {
          return byte.toString(16).padStart(2, '0');
        }).join('');
        const pending = {
          requestId: requestId,
          text: '',
          started: false,
          onDelta: onDelta,
          resolve: resolve,
          reject: reject,
          cleanup: function () { signal.removeEventListener('abort', onAbort); }
        };
        function onAbort() {
          if (gatewayPending !== pending) return;
          gatewayPending = null;
          pending.cleanup();
          try { if (conn.open) conn.send({ type: 'ai-cancel', requestId: requestId }); } catch (e) {}
          reject(new DOMException('Cancelado', 'AbortError'));
        }
        gatewayPending = pending;
        signal.addEventListener('abort', onAbort, { once: true });
        try {
          conn.send({ type: 'msg', text: text, requestId: requestId });
        } catch (error) {
          gatewayPending = null;
          pending.cleanup();
          reject(new Error('Não foi possível enviar a mensagem ao host.'));
        }
      });
    });
  }

  function readDataURL(file) {
    return new Promise(function (resolve, reject) {
      const r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error('Não consegui ler ' + file.name)); };
      r.readAsDataURL(file);
    });
  }

  // Reduz imagens grandes para não pesar no envio
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        const k = Math.min(1, 1568 / Math.max(img.width, img.height));
        const cw = Math.max(1, Math.round(img.width * k));
        const ch = Math.max(1, Math.round(img.height * k));
        const c = document.createElement('canvas');
        c.width = cw;
        c.height = ch;
        const g = c.getContext('2d');
        g.fillStyle = '#fff';
        g.fillRect(0, 0, cw, ch);
        g.drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('Não consegui abrir a imagem ' + file.name));
      };
      img.src = url;
    });
  }

  async function processFile(file) {
    const name = file.name || 'arquivo';
    if (file.type.indexOf('image/') === 0) {
      return { name: name, kind: 'image', data: await shrinkImage(file) };
    }
    if (file.type === 'application/pdf' || /\.pdf$/i.test(name)) {
      if (file.size > 10 * 1024 * 1024) throw new Error(name + ' é grande demais (máx. 10 MB).');
      const data = (await readDataURL(file)).replace(/^data:[^;]*;/, 'data:application/pdf;');
      return { name: name, kind: 'pdf', data: data };
    }
    if (file.type.indexOf('text/') === 0 || file.type === 'application/json' || TEXT_EXT.test(name)) {
      let text = await file.text();
      const truncated = text.length > MAX_TEXT;
      if (truncated) text = text.slice(0, MAX_TEXT);
      return { name: name, kind: 'text', data: text, truncated: truncated };
    }
    throw new Error('Formato não suportado: ' + name);
  }

  function renderChips() {
    chipsEl.innerHTML = '';
    attached.forEach(function (f, i) {
      const chip = document.createElement('div');
      chip.className = 'chip';
      if (f.kind === 'image') {
        const im = document.createElement('img');
        im.src = f.data;
        im.alt = '';
        chip.appendChild(im);
      }
      const sp = document.createElement('span');
      sp.textContent = f.name;
      chip.appendChild(sp);
      const x = document.createElement('button');
      x.type = 'button';
      x.textContent = '×';
      x.setAttribute('aria-label', 'Remover ' + f.name);
      x.addEventListener('click', function () {
        attached.splice(i, 1);
        renderChips();
      });
      chip.appendChild(x);
      chipsEl.appendChild(chip);
    });
    chipsEl.classList.toggle('has', attached.length > 0);
  }

  async function addFiles(list) {
    const arr = Array.prototype.slice.call(list);
    for (let i = 0; i < arr.length; i++) {
      if (attached.length >= MAX_FILES) { flash('Máximo de ' + MAX_FILES + ' anexos.'); break; }
      try {
        attached.push(await processFile(arr[i]));
      } catch (err) {
        flash(err.message);
      }
    }
    renderChips();
  }

  let listening = false;

  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = 'Ditado por voz não é suportado neste navegador (use Chrome, Edge ou Safari)';
  }

  function setInput(val) {
    input.value = val;
    input.dispatchEvent(new Event('input'));   // faz a esfera reagir ao texto transcrito
  }

  function startListening() {
    rec = new SR();
    rec.lang = 'pt-BR';
    rec.interimResults = true;
    rec.continuous = true;
    const base = input.value ? input.value.replace(/\s+$/, '') + ' ' : '';
    let finals = '';

    rec.onresult = function (e) {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finals += t; else interim += t;
      }
      setInput(base + finals + interim);
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') flash('Permita o uso do microfone no navegador.');
      else if (e.error === 'audio-capture') flash('Microfone não encontrado.');
      else if (e.error === 'network') flash('Sem conexão para o ditado por voz.');
    };
    rec.onend = function () {
      listening = false;
      micBtn.classList.remove('rec');
      input.focus();
    };

    try {
      rec.start();
      listening = true;
      micBtn.classList.add('rec');
    } catch (err) {
      flash('Não foi possível iniciar o microfone.');
    }
  }

  function stopListening() {
    if (rec && listening) {
      try { rec.stop(); } catch (e) {}
    }
  }

  micBtn.addEventListener('click', function () {
    if (!SR) return;
    if (listening) stopListening(); else startListening();
  });

  // ---- Apagar histórico (dois cliques para confirmar) ----
  const clearBtn = document.getElementById('clear');
  let clearArmT = 0;

  function disarmClear() {
    clearTimeout(clearArmT);
    clearBtn.classList.remove('warn');
    clearBtn.title = 'Apagar histórico';
  }

  function clearHistory() {
    if (busy) stopAll();
    convo.length = 0;
    userEl.style.opacity = 0;
    userEl.textContent = '';
    replyEl.style.opacity = 0;
    replyEl.innerHTML = '';
    for (let k = 0; k < 6; k++) {
      const p = points[Math.floor(Math.random() * COUNT)];
      addPulse({ x: p.x, y: p.y, z: p.z }, -0.05, -30 + Math.random() * 70);   // a esfera "respira fundo"
    }
    flash('Histórico apagado.');
  }

  clearBtn.addEventListener('click', function () {
    if (!clearBtn.classList.contains('warn')) {
      clearBtn.classList.add('warn');
      clearBtn.title = 'Clique de novo para apagar';
      clearArmT = setTimeout(disarmClear, 3000);
      return;
    }
    disarmClear();
    clearHistory();
    input.focus();
  });

  // ---- Parar processamento (cancela a espera ou trunca a resposta) ----
  const stopBtn = document.getElementById('stop');
  function setBusyUI(on) {
    stopBtn.style.display = on ? '' : 'none';
    micBtn.style.display = on ? 'none' : '';
  }
  function stopAll() {
    if (!busy) return;
    stopRequested = true;
    if (abortCtl) abortCtl.abort();
  }
  stopBtn.addEventListener('click', stopAll);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && busy && !openId) stopAll();
  });

  // mantém o foco na barra (sem atrapalhar o painel de configuração)
  document.addEventListener('click', function (e) {
    if (toolsEl.contains(e.target)) return;
    if (openId) closePanel();
    input.focus();
  });
  input.focus();

  // ---- Mouse / toque: as partículas se afastam do cursor e voltam depois ----
  const mouse = { x: -1e4, y: -1e4, lx: -1e4, ly: -1e4, speed: 0, active: false };
  function aim(e) {
    if (!mouse.active) { mouse.lx = e.clientX; mouse.ly = e.clientY; }
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }
  window.addEventListener('pointermove', aim);
  window.addEventListener('pointerdown', aim);
  window.addEventListener('pointerup', function (e) { if (e.pointerType !== 'mouse') mouse.active = false; });
  window.addEventListener('pointercancel', function () { mouse.active = false; });
  window.addEventListener('blur', function () { mouse.active = false; });
  document.documentElement.addEventListener('mouseleave', function () { mouse.active = false; });

  // ---- Animação ----
  let angleY = 0;
  const tiltX = 0.35;
  const cosX = Math.cos(tiltX), sinX = Math.sin(tiltX);
  let t = 0;

  function frame(now) {
    ctx.clearRect(0, 0, w, h);

    // acompanha suavemente o espaço disponível acima das mensagens
    radius += (tR - radius) * 0.06;
    cy += (tC - cy) * 0.06;

    // intensidade do "pensando": sobe suave, segura enquanto espera e desce suave
    let level = 0, tk = 0;
    if (thinkStart) {
      const el = now - thinkStart;
      let l = Math.min(1, el / 600);
      if (thinkEnd) {
        const out = (now - thinkEnd) / 1000;
        if (out >= 1) { thinkStart = 0; l = 0; }
        else l *= 1 - out;
      }
      if (thinkStart) {
        level = l * l * (3 - 2 * l);
        tk = el / 1000;
      }
    }

    angleY += SPEED_Y * (1 + 3 * level);
    t += 0.01;

    const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

    // remove pulsos já apagados
    for (let i = pulses.length - 1; i >= 0; i--) {
      if ((now - pulses[i].t0) / 1000 > 3) pulses.splice(i, 1);
    }
    const act = pulses.map(function (p) {
      const age = (now - p.t0) / 1000;
      return { x: p.x, y: p.y, z: p.z, age: age, env: Math.exp(-age * 1.5), amp: p.amp, hue: p.hue };
    });

    // dois pontos que orbitam a esfera enquanto ela "pensa"
    const orbits = [];
    if (level > 0) {
      const a1 = tk * 1.9, a2 = tk * 1.3 + 2.4;
      orbits.push(
        { x: Math.cos(a1), y: Math.sin(tk * 1.1) * 0.7, z: Math.sin(a1) },
        { x: -Math.cos(a2), y: Math.cos(tk * 0.9) * 0.7, z: Math.sin(a2) }
      );
      for (const o of orbits) {
        const l = Math.sqrt(o.x * o.x + o.y * o.y + o.z * o.z);
        o.x /= l; o.y /= l; o.z /= l;
      }
    }
    const breath = level * 0.025 * Math.sin(tk * 3.2);

    // alcance do cursor e força (mais forte quando o mouse se move rápido)
    const reach = Math.max(80, radius * 0.55);
    const reach2 = reach * reach;
    if (mouse.active) {
      const mdx = mouse.x - mouse.lx, mdy = mouse.y - mouse.ly;
      mouse.speed += (Math.sqrt(mdx * mdx + mdy * mdy) - mouse.speed) * 0.2;
    } else {
      mouse.speed *= 0.8;
    }
    mouse.lx = mouse.x;
    mouse.ly = mouse.y;
    const mouseBoost = (1 + Math.min(1.5, mouse.speed / 25)) * (reach / 110);

    const projected = [];
    for (const p of points) {
      let disp = 0, glow = 0, hueShift = 0;
      for (const a of act) {
        const dx = p.x - a.x, dy = p.y - a.y, dz = p.z - a.z;
        const d2 = dx * dx + dy * dy + dz * dz;
        const g = Math.exp(-d2 / (2 * SIGMA * SIGMA));
        if (g < 0.01) continue;
        const wave = 0.65 + 0.35 * Math.sin(a.age * 12 - Math.sqrt(d2) * 9);
        disp += a.amp * g * a.env * wave;
        glow += g * a.env;
        hueShift += a.hue * g * a.env;
      }
      if (level > 0) {
        // faixas de onda percorrendo a esfera de cima a baixo
        const band = Math.sin(p.y * 5 - tk * 4.5);
        disp += level * 0.03 * band;
        glow += level * 0.2 * (band * 0.5 + 0.5);
        hueShift += level * 22 * Math.sin(p.y * 3 - tk * 3 + p.x * 1.5);
        // regiões brilhantes que orbitam
        for (const o of orbits) {
          const dx = p.x - o.x, dy = p.y - o.y, dz = p.z - o.z;
          const g = Math.exp(-(dx * dx + dy * dy + dz * dz) / (2 * 0.3 * 0.3));
          glow += level * g * 0.8;
          disp += level * g * 0.05;
          hueShift += level * g * 30;
        }
      }
      if (glow > 1) glow = 1;

      const m = 1 + Math.sin(t + p.phase) * 0.008 + disp + breath;
      const px = p.x * m, py = p.y * m, pz = p.z * m;

      // rotação em Y e inclinação em X
      const x = px * cosY + pz * sinY;
      const z = -px * sinY + pz * cosY;
      const y2 = py * cosX - z * sinX;
      const z2 = py * sinX + z * cosX;

      const scale = FOCAL / (FOCAL + z2 * radius);
      const bx = w / 2 + x * radius * scale;
      const by = cy + y2 * radius * scale;

      // o cursor empurra a partícula (com um leve giro) e uma mola a traz de volta
      let fx = 0, fy = 0;
      if (mouse.active) {
        const dx = bx - mouse.x, dy = by - mouse.y;
        const dm2 = dx * dx + dy * dy;
        if (dm2 < reach2 && dm2 > 0.01) {
          const d = Math.sqrt(dm2);
          const tt = 1 - d / reach;
          const f = tt * tt * mouseBoost;
          const nx = dx / d, ny = dy / d;
          fx = (nx - ny * 0.35) * f;
          fy = (ny + nx * 0.35) * f;
        }
      }
      p.vx = (p.vx + fx * 2.2 - p.ox * 0.045) * 0.86;
      p.vy = (p.vy + fy * 2.2 - p.oy * 0.045) * 0.86;
      p.ox += p.vx;
      p.oy += p.vy;
      const moved = Math.min(1, Math.sqrt(p.ox * p.ox + p.oy * p.oy) / (radius * 0.2));

      projected.push({
        sx: bx + p.ox,
        sy: by + p.oy,
        depth: (z2 + 1) / 2,
        scale: scale,
        z: z2,
        glow: Math.min(1, glow + moved * 0.5),   // partículas deslocadas brilham um pouco
        hue: hueShift + moved * 18
      });
    }

    projected.sort(function (a, b) { return b.z - a.z; });

    for (const q of projected) {
      const front = 1 - q.depth;
      const size = (0.8 + front * 1.9 * q.scale) * (1 + q.glow * 0.4);
      const alpha = Math.min(1, 0.18 + front * 0.82 + q.glow * 0.15);
      const light = 52 - front * 14 + q.glow * 3;
      const sat = 70 + q.glow * 10;
      const hue = 140 + Math.max(-45, Math.min(55, q.hue));
      ctx.beginPath();
      ctx.fillStyle = 'hsla(' + hue + ',' + sat + '%,' + light + '%,' + alpha + ')';
      ctx.arc(q.sx, q.sy, size, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
(function () {
  const nav = document.getElementById('selene-nav');
  const toggle = nav.querySelector('button');
  const links = Array.from(nav.querySelectorAll('a'));
  const currentPage = (location.pathname.split('/').pop() || 'Index.html').toLowerCase();

  links.forEach(function (link) {
    const page = new URL(link.href, location.href).pathname.split('/').pop().toLowerCase();
    if (page === currentPage) link.setAttribute('aria-current', 'page');
  });

  function setOpen(open) {
    nav.classList.toggle('open', open);
    toggle.setAttribute('aria-expanded', String(open));
  }

  toggle.addEventListener('click', function () {
    setOpen(toggle.getAttribute('aria-expanded') !== 'true');
  });
  document.addEventListener('click', function (event) {
    if (!nav.contains(event.target)) setOpen(false);
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && nav.classList.contains('open')) {
      setOpen(false);
      toggle.focus();
    }
  });
  links.forEach(function (link) {
    link.addEventListener('click', function (event) {
      const page = new URL(link.href, location.href).pathname.split('/').pop().toLowerCase();
      if (page === currentPage || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
      event.preventDefault();
      document.body.classList.add('selene-page-leaving');
      window.setTimeout(function () { location.href = link.href; }, 180);
    });
  });
})();
</script>

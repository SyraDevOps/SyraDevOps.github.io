<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoMark · Perfil</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="main.html"><svg viewBox="0 0 32 32" fill="none"><path d="M16 2C8.3 2 2 8.3 2 16s6.3 14 14 14c6 0 11-3.8 13-9.1L16 25l-7-7 5-5 2.7 2.7L21 11.4 17.6 8A14 14 0 0 0 16 2Z" fill="#39bdf7"/></svg>GeoMark</a><nav class="nav"><a href="main.html">Mapa</a><a href="settings.html">Configurações</a><button id="logout">Sair</button></nav></header><main class="page"><div class="profile-wrap"><section class="profile-card"><div><img class="profile-photo hidden" id="photo" alt=""><div class="profile-photo fallback" id="fallback">G</div></div><div><div class="username" id="username">@...</div><h1 class="profile-name" id="displayName">Carregando…</h1><p class="bio" id="bio"></p><div class="stats"><div class="stat"><b id="markers">0</b><span>marcações</span></div><div class="stat"><b id="edits">0</b><span>contribuições</span></div><div class="stat"><b id="rep">0</b><span>reputação</span></div><div class="stat"><b id="confidence">—</b><span>confirmadas pela comunidade</span></div></div><small id="joined" style="color:var(--muted)"></small></div></section><section class="settings"><h2>Editar perfil</h2><p>Seu nome, @usuário e link de foto são públicos. A data de nascimento fica privada e só é usada para calcular sua idade.</p><form id="profileForm" class="form-grid"><div class="two"><div class="field"><label>Nome de exibição</label><input id="editName" required></div><div class="field"><label>@usuário</label><input id="editUsername" required maxlength="24"></div></div><div class="field"><label>Bio</label><textarea id="editBio" maxlength="180"></textarea></div><div class="two"><div class="field"><label>Link da foto de perfil</label><input id="profilePhoto" type="url" placeholder="https://..."></div><div class="field"><label>Data de nascimento (privada)</label><input id="editBirthDate" type="date" required></div></div><div class="form-actions"><button class="primary" type="submit">Salvar perfil</button></div></form></section></div></main><div class="notice hidden" id="notice"></div><script type="module" src="profile.js"></script></body></html>

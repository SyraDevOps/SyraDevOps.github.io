<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>GeoMark · Configurações</title><style>.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.theme{min-height:74px;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#111;font-weight:750;text-align:left}.theme:hover,.theme.selected{border:2px solid var(--p);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--p) 10%,#fff)}.theme i{display:block;width:34px;height:8px;margin-bottom:10px;border-radius:8px;background:linear-gradient(90deg,var(--p),var(--s))}.about-card{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface-alt)}</style></head><body><header class="topbar"><a class="brand" href="main.html" aria-label="GeoMark"><img class="brand-mark" src="assets/logo-point.svg" alt=""></a><nav class="nav"><a href="main.html" data-i18n="map">Mapa</a><a href="profile.html" data-i18n="profile">Perfil</a></nav></header><main class="page"><div class="profile-wrap"><section class="settings"><h1 data-i18n="settings">Configurações</h1><p>As cores e o idioma são salvos no seu perfil e aplicados em qualquer dispositivo.</p><form id="settingsForm" class="form-grid"><div class="field"><label data-i18n="language">Idioma</label><select id="locale"><option value="pt-BR">Português (Brasil)</option><option value="en">English</option><option value="es">Español</option></select></div><div class="field"><label data-i18n="theme">Temas predefinidos</label><div class="themes"><button type="button" class="theme" data-p="#111111" data-s="#686868" style="--p:#111111;--s:#686868"><i></i>Monocromático</button><button type="button" class="theme" data-p="#173b6c" data-s="#5e7ea6" style="--p:#173b6c;--s:#5e7ea6"><i></i>Profundo</button><button type="button" class="theme" data-p="#7a3e14" data-s="#c28546" style="--p:#7a3e14;--s:#c28546"><i></i>Terra</button><button type="button" class="theme" data-p="#3b1f5c" data-s="#876aa2" style="--p:#3b1f5c;--s:#876aa2"><i></i>Íris</button></div></div><div class="two"><div class="field"><label data-i18n="primary">Cor primária</label><input id="primary" type="color" value="#111111"></div><div class="field"><label data-i18n="secondary">Cor secundária</label><input id="secondary" type="color" value="#686868"></div></div><button class="primary" data-i18n="save">Salvar preferências</button></form><section class="about-card"><h2 data-i18n="about">Sobre</h2><p>GeoMark versão 1.0</p><p>Produzido por <strong>@Syradevops</strong></p><p>Mapa comunitário e aberto para descobertas, alertas e presença local.</p></section></section></div></main><script type="module" src="theme.js"></script><script type="module" src="settings.js"></script><script type="module" src="pwa.js"></script></body></html>

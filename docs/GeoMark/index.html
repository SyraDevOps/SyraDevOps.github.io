<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>GeoMark · Acesso</title></head><body class="auth-body"><main class="auth-shell"><img class="auth-logo" src="assets/logo-point.svg" alt="GeoMark"><h1 id="authTitle">Marque sua presença.</h1><p class="lead">GeoMark é um mapa comunitário e aberto onde pessoas podem marcar lugares, compartilhar descobertas e deixar sua presença pelo mundo.</p><button class="google" id="google" type="button" aria-label="Continuar com Google"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.8 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1v2.5h3.2c1.9-1.8 3.1-4.3 3.1-7.4Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4l-3.2-2.5c-.9.6-2 .9-3.5.9-2.7 0-5-1.8-5.8-4.3H3v2.6A10 10 0 0 0 12 22Z"/></svg>Continuar com Google</button><div class="divider">ou com e-mail</div><form class="auth-form" id="authForm"><input class="signup-only hidden" id="name" placeholder="Seu nome completo" autocomplete="name"><input class="signup-only hidden" id="username" placeholder="Nome de usuário" autocomplete="username" maxlength="24"><input class="signup-only hidden" id="birthDate" type="date" aria-label="Data de nascimento"><label class="signup-only hidden" id="termsLabel"><input id="termsCheck" type="checkbox"> Aceito os <a href="terms.html" target="_blank">Termos de Comunidade</a>.</label><input id="email" type="email" placeholder="Seu e-mail" autocomplete="email" required><input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" minlength="6" required><button class="primary" id="submit" type="submit">Entrar</button></form><p class="auth-message" id="message" aria-live="polite"></p><p class="switch"><span id="switchLabel">Ainda não tem conta?</span> <button class="text-btn" id="switch" type="button">Criar conta</button></p></main><script type="module" src="theme.js"></script><script type="module" src="auth.js"></script><script type="module" src="pwa.js"></script></body></html>
